  reload: '%plugin% &aThe plugin has been reloaded'

  info:
    - '&b&l--> --> %plugin% &e&lInfo &b&l<-- <--'
    - '&6&l>> &ePlugin Version: &b%version%'
    - '&6&l>> &ePlugin Data Storage: &b%dataStorage%'
    - '&b&l····· &aPlugin Hooks &b&l·····'
    - '%pluginHooksList%'

  permissions:
    - '&b<-----------------&aMINEBANK PERMISSIONS&b----------------->'
    - '&6minebank.admin &7- Allows to unlock admin commands'
    - '&6minebank.migration &7- Allows to migrate plugin data to other database systems'
    - '&6minebank.backup &7- Allows to backup plugin data'
    - '&6minebank.updatechecker &7- Allows to receive a message if there is a plugin update'
    - '&eminebank.bank.use &7- Allows to use the bank plugin commands'
    - '&eminebank.bank.<bankName> &7- Allows to have the bank <bankName>'

  command-no-argument: '%plugin% &7Use &e/minebank help &7to see the command list'
  no-perm: '%chatPlugin% &cYou don´t have permission to use that command'
  console-error: '%plugin% &cYou can´t use that command in console'
  processing-command-error: '%plugin% &cAn error occurred while processing the command'

config:

  # If in the configuration the key "config.update-checker: true"
  # This message will be displayed in chat only for OP players, or
  # players with the "minebank.updatechecker" or "minebank.admin" permission
  update-checker:
    - '&b&l--> --> %plugin% &e&lUpdate Checker &b&l<-- <--'
    - '&bThere is a new version available. &f(&e%latestVersion%&f)'
    - '&bDownload it here: &f%link%'
    - '&bRead changelog: &f%link%/updates'

  # If in the configuration the key "config.bank-allowed: false"
  # This message will be displayed in the chat when using any bank command
  bank-disabled: '%chatPlugin% &cThe bank is temporarily disabled'

bank:

  help:
    - '&b<-----------------&aMINEBANK COMMANDS&b----------------->'
    - '&e/bank &7- Open gui (1.13+)'
    - '&e/bank help &7- Show bank help'
    - '&e/bank data &7- Show your bank data'
    - '&e/bank data <player> &7- Show bank data of player'
    - '&e/bank add <amount> &7- Deposit amount money'
    - '&e/bank add half-balance &7- Deposit half of your current bank balance'
    - '&e/bank add all &7- Deposit all your balance or until your max bank balance'
    - '&e/bank add mid-max &7- Deposit half of your max bank balance'
    - '&e/bank take <amount> &7- Withdraw amount money'
    - '&e/bank take half-balance &7- Withdraw half of your current bank balance'
    - '&e/bank take all &7- Withdraw all your bank balance'
    - '&e/bank take mid-max &7- Withdraw half of your max bank balance'
    - '&e/bank levelup &7- Level up your bank'
    - '&e/bank top &7- Show top 10 players with the most money'
    - '&e/bank top <amount> &7- Show top amount players with the most money'
    - '&e/bank top player <player> &7- Show top position and bank data of player'
    - '&e/bank receive profit &7- Receive the offline accumulated benefits'
    - '&e/bank transactions [page] &7- Open your paged transaction history'
    - '&e/bank events &7- Open the events GUI'
    - '&e/bank gui <GUI> &7- Open a selected gui'
    - '&e/bank web &7- Open your bank web panel'

  # To migrate from JSON to MYSQL (/minebank migrate JSON-MYSQL)
  # To use the new database system be sure to change it in config.yml section "bank.data.type" after migrate data
  migrate:
    usage-admin:
      - '%chatPlugin% &eUsage:'
      - '&6/minebank migrate {<FROM>-<TO>} &7- Migrate data to another database system'
      - '&6/minebank migrate confirm &7- Confirm migration'
      - '&7Aliases: &eminebank&7, &emb'
    not-supported: '%plugin% &cThis migration is not supported'
    same-storage-type:
      - '%plugin% &cError: Both storages are the same'
      - '%plugin% &7 You can make a backup using &e/minebank backup'
    not-current-data-type: '%plugin% &cError: %MIGRATEDFROM% is not the current "bank.data.type" in config'
    success:
      - '%plugin% &aMigration completed from %MIGRATEDFROM% to %MIGRATEDTO%!'
      - '%plugin% &7Players: %MIGRATEDPLAYERS%, Banks: %MIGRATEDBANKS%, Interests: %MIGRATEDINTERESTS%, Transactions: %MIGRATEDTRANSACTIONS%, Time: %MIGRATIONTIME%'
      - '%plugin% &eModify "bank.data.type" value in config to use %MIGRATEDTO% and restart the server'
    failed: '%plugin% &cMigration failed: Error %MIGRATIONERROR%'
    failed-connection: '%plugin% &cMigration failed: %MIGRATEDTO% connection could not be established, check "bank.data" values in config'
    failed-credentials: '%plugin% &cMigration failed: %MIGRATEDTO% credentials are empty or malformed'
    confirm-needed:
      - '%plugin% &7Use &a/minebank migrate confirm &7to continue with the migration'
      - '%plugin% &eIt is highly recommended to make a backup before confirm the migration and to verify that it has been done correctly'
      - '%plugin% &7Use &e/minebank backup &7to make a backup'
    confirm-expired: '%plugin% &cThe migration has been automatically cancelled'
    no-pending: '%plugin% &cYou have no pending migrations'

  backup:
    usage-admin:
      - '%chatPlugin% &eUsage:'
      - '&6/minebank backup &7- Make a plugin data backup'
      - '&7Aliases: &eminebank&7, &emb'
    success: '%plugin% &aBackup completed. Using %datastorage%'
    failed: '%plugin% &cBackup failed'

  event:
    usage-admin:
      - '%chatPlugin% &eUsage:'
      - '&6/minebank event {profit/tax} <multiplier> <duration> &7- Start a special event'
      - '&6/minebank event {profit/tax} cancel &7- Cancel a special event'
      - '&7Aliases: &eminebank&7, &emb'
    invalid-multiplier: '%plugin% &cInvalid multiplier. Use format x2, x0.6, x4.25'
    invalid-duration: '%plugin% &cInvalid duration. Use 10s, 25m, 3h, 4d, 1w'
    started: '%plugin% &aEvent %type% started: x%multiplier% for %duration%'
    cancelled: '%plugin% &eEvent %type% cancelled'
    not-active: '%plugin% &cNo active %type% event'

  manage:
    usage-admin:
      - '%chatPlugin% &eUsage:'
      - '&6/minebank bank create <newbankname> &7- Create a new bank'
      - '&6/minebank bank rename <oldname> <newname> &7- Rename a bank'
      - '&6/minebank bank add <bankname> level <newlevel> max_balance <value> upgrade_cost <value> &7- Add a bank level'
      - '&6/minebank bank modify <bankname> level <value> max_balance <value> &7- Modify level max balance'
      - '&6/minebank bank modify <bankname> level <value> upgrade_cost <value> &7- Modify level upgrade cost'
      - '&6/minebank bank modify <bankname> priority <value> &7- Change bank priority'
      - '&6/minebank bank delete <bankname> level <value> &7- Delete a bank level'
      - '&6/minebank bank delete <bankname> &7- Delete a bank (confirm required)'
      - '&6/minebank bank delete confirm &7- Confirm bank deletion'
      - '&7Aliases: &eminebank&7, &emb'
    bank-exists: '%chatPlugin% &cThe bank %bankName% already exists'
    bank-not-found: '%chatPlugin% &cThe bank %bankName% does not exist'
    bank-renamed: '%chatPlugin% &aBank %bankName% renamed to %newBankName%'
    invalid-bank-name: '%chatPlugin% &cInvalid bank name. Use 3+ chars with letters, numbers, _ or +'
    upgrade-cost-too-high: '%chatPlugin% &cUpgrade cost cannot be greater than max balance'
    bank-created: '%chatPlugin% &aBank %bankName% created'
    bank-deleted: '%chatPlugin% &aBank %bankName% deleted'
    level-added: '%chatPlugin% &aAdded level %level% to bank %bankName%'
    level-modified: '%chatPlugin% &aUpdated level %level% of bank %bankName%'
    level-deleted: '%chatPlugin% &aDeleted level %level% from bank %bankName%'
    level-not-found: '%chatPlugin% &cLevel %level% not found in bank %bankName%'
    level-last-cannot-delete: '%chatPlugin% &cYou cannot delete the last level of bank %bankName%'
    priority-updated: '%chatPlugin% &aBank %bankName% priority set to %priority%'
    delete-confirm-needed:
      - '%chatPlugin% &7Use &a/minebank bank delete confirm &7to delete %bankName%'
      - '%chatPlugin% &eThis confirmation expires in 10 seconds'
    delete-confirm-expired: '%chatPlugin% &cThe bank deletion has been automatically cancelled'
    delete-no-pending: '%chatPlugin% &cYou have no pending bank deletions'

  item:
    usage-admin:
      - '%chatPlugin% &eUsage:'
      - '&6/minebank item list &7- Show all saved custom item ids'
      - '&6/minebank item save <customItemID> &7- Save the item in your hand'
      - '&6/minebank item get <customItemID> [amount] &7- Get a saved custom item'
      - '&6/minebank item rename <customItemID> <newCustomItemID> &7- Prepare a rename'
      - '&6/minebank item replace <customItemID> &7- Prepare replacing it with the item in your hand'
      - '&6/minebank item delete <customItemID> &7- Prepare deleting a custom item'
      - '&6/minebank item <rename|replace|delete> <confirm|cancel> &7- Confirm or cancel'
    list-header: '%chatPlugin% &eSaved custom items: &f%amount%'
    list-entry: '&6- &e%customItemID%'
    list-empty: '%chatPlugin% &cThere are no saved custom items'
    invalid-id: '%chatPlugin% &cInvalid custom item id &e%customItemID%&c. Use letters, numbers, _ or -'
    invalid-new-id: '%chatPlugin% &cInvalid new custom item id &e%newCustomItemID%&c. Use letters, numbers, _ or -'
    already-exists: '%chatPlugin% &cCustom item id already exists: &e%customItemID%'
    target-exists: '%chatPlugin% &cTarget custom item id already exists: &e%newCustomItemID%'
    hand-empty: '%chatPlugin% &cYou must hold an item in your main hand'
    saved: '%chatPlugin% &aSaved custom item &e%customItemID%'
    not-found: '%chatPlugin% &cCustom item not found: &e%customItemID%'
    load-failed: '%chatPlugin% &cCould not load custom item: &e%customItemID%'
    received: '%chatPlugin% &aReceived custom item &e%customItemID% &7x%amount%'
    rename-confirm-needed:
      - '%chatPlugin% &7Use &a/minebank item rename confirm &7to rename &e%customItemID% &7to &e%newCustomItemID%'
      - '%chatPlugin% &eUse &c/minebank item rename cancel &eto cancel'
    replace-confirm-needed:
      - '%chatPlugin% &7Use &a/minebank item replace confirm &7to replace &e%customItemID%'
      - '%chatPlugin% &eUse &c/minebank item replace cancel &eto cancel'
    delete-confirm-needed:
      - '%chatPlugin% &7Use &a/minebank item delete confirm &7to delete &e%customItemID%'
      - '%chatPlugin% &eUse &c/minebank item delete cancel &eto cancel'
    no-pending: '%chatPlugin% &cYou have no pending custom item action'
    cancelled: '%chatPlugin% &eCancelled pending custom item action'
    renamed: '%chatPlugin% &aRenamed custom item &e%customItemID% &ato &e%newCustomItemID%'
    pending-item-invalid: '%chatPlugin% &cThe pending replacement item is no longer valid'
    replaced: '%chatPlugin% &aReplaced custom item &e%customItemID%'
    deleted: '%chatPlugin% &aDeleted custom item &e%customItemID%'
    confirm-expired: '%chatPlugin% &cThe pending custom item action expired'
    gui:
      custom-item-not-found-name: '&cCustom item not found'
      custom-item-not-found-lore:
        - '&7ID: &f%customItemID%'
        - '&7GUI: &f%guiName%'
        - '&7Slot: &f%slot%'

  events:
    usage:
      - '%chatPlugin% &eUsage:'
      - '&e/bank events &7- Open the events GUI'
    usage-admin:
      - '%chatPlugin% &eUsage:'
      - '&e/bank events &7- Open the events GUI'
    gui-items:
      profit-title: '&aProfit x%multiplier%'
      tax-title: '&cTax x%multiplier%'
      remaining: '&7Remaining: &f%remaining%'

  general-usage: '%chatPlugin% &eUsage: /bank {help/data/add/take/levelup/top/receive/transactions/events/web}'

  unregistered-player: '%chatPlugin% &cThe player is not registered'
  unregistered-bank: '%chatPlugin% &cThe bank is not registered correctly'
  not-positive-integer: '%chatPlugin% &cThe amount must be positive and integer number'

  data:
    usage:
      - '%chatPlugin% &eUsage:'
      - '&e/bank data &7- Show your bank data: name, level and balance'
      - '&e/bank data <player> &7- Show bank data of a player'
    usage-admin:
      - '%chatPlugin% &eUsage:'
      - '&e/bank data &7- Show your bank data: name, level and balance'
      - '&e/bank data <player> &7- Show bank data of a player'
    bank-data:
      - '%chatPlugin% &e&l%playerName%´s bank data:'
      - '&6&l>> &eBank: &a%playerBankName%'
      - '&6&l>> &eLevel: &a%playerBankLevel%&e/&a%playerBankMaxLevel%'
      - '&6&l>> &eLevel up cost: &a%playerBankNextLevelCost%'
      - '&6&l>> &eBalance: &a%playerBankBalance%&e/&a%playerBankMaxBalance%'

  add:
    usage:
      - '%chatPlugin% &eUsage:'
      - '&e/bank add <amount> &7- Deposit an amount of money'
      - '&e/bank add half-balance &7- Deposit half of your current money'
      - '&e/bank add all &7- Deposit all your money or until your max bank balance'
      - '&e/bank add mid-max &7- Deposit half of your max bank balance'
    usage-admin:
      - '%chatPlugin% &eUsage:'
      - '&e/bank add <amount> &7- Deposit an amount of money'
      - '&e/bank add half-balance &7- Deposit half of your current money'
      - '&e/bank add all &7- Deposit all your money or until your max bank balance'
      - '&e/bank add mid-max &7- Deposit half of your max bank balance'
      - '&6/bank add player <player> <amount> &7- Add an amount to the player bank balance'
    deposit-success: '%chatPlugin% &aYou have deposited &e%amount% &ainto your bank'
    deposit-exceeds: '%chatPlugin% &cYou cannot store more than %playerBankMaxBalance% at your current bank level'
    not-enough-bank-balance: '%chatPlugin% &cYou do not have enough balance to deposit that amount'
    target-deposit-success: '%chatPlugin% &aYou have added &e%amount% &ainto &e%targetPlayerName%&a´s &abank'
    target-deposit-exceeds: '%chatPlugin% &c%targetPlayerName%´s bank cannot store more than %targetBankMaxBalance%'

  take:
    usage:
      - '%chatPlugin% &eUsage:'
      - '&e/bank take <amount> &7- Withdraw an amount of money'
      - '&e/bank take half-balance &7- Withdraw half of your current bank balance'
      - '&e/bank take all &7- Withdraw all your bank balance'
      - '&e/bank take mid-max &7- Withdraw half of your max bank balance'
    usage-admin:
      - '%chatPlugin% &eUsage:'
      - '&e/bank take <amount> &7- Withdraw an amount of money'
      - '&e/bank take half-balance &7- Withdraw half of your current bank balance'
      - '&e/bank take all &7- Withdraw all your bank balance'
      - '&e/bank take mid-max &7- Withdraw half of your max bank balance'
      - '&6/bank take player <player> <amount> &7- Withdraw an amount from the player bank balance'
    withdraw-success: '%chatPlugin% &aYou have withdraw &e%amountReceived% &afrom your bank. Bank charge: &e%amountDeducted%&a. Interest: &e%interestPercentage%%'
    withdraw-exceeds: '%chatPlugin% &cYou can´t withdraw that amount because the interests'
    not-enough-bank-balance: '%chatPlugin% &cYou do not have enough balance in your bank to withdraw that amount'
    target-withdraw-success: '%chatPlugin% &aYou have withdraw &e%amount% &afrom &e%targetPlayerName%&a´s bank'
    target-not-enough-bank-balance: '%chatPlugin% &c%targetPlayerName%´s bank do not have enough balance'

  levelup:
    usage:
      - '%chatPlugin% &eUsage:'
      - '&e/bank levelup &7- Level up your bank'
    usage-admin:
      - '%chatPlugin% &eUsage:'
      - '&e/bank levelup &7- Level up your bank'
      - '&6/bank levelup <player> &7- Level up the player bank'
    levelup-success: '%chatPlugin% &aYou have leveled up to level &e%newPlayerBankLevel%&a, now you can store &e%newPlayerBankMaxBalance%'
    already-max-level: '%chatPlugin% &cYou are already at the maximum bank level'
    not-enough-bank-balance: '%chatPlugin% &cYou don´t have enough balance in the bank to level up, you need %playerBankNextLevelCost%'
    target-levelup-success: '%chatPlugin% &aLeveled up &e%targetPlayerName%&a´s bank to level &e%targetBankLevel% &asuccessfully'
    target-already-max-level: '%chatPlugin% &c%targetPlayerName% is already at the maximum bank level'

  top:
    usage:
      - '%chatPlugin% &eUsage:'
      - '&e/bank top &7- Show top players with the most money'
      - '&e/bank top <amount> &7- Show a number of top players with the most money'
      - '&e/bank top player <player> &7- Show top position and bank data of player'
    usage-admin:
      - '%chatPlugin% &eUsage:'
      - '&e/bank top &7- Show top players with the most money'
      - '&e/bank top <amount> &7- Show a number of top players with the most money'
      - '&e/bank top player <player> &7- Show top position and bank data of player'
    title:
      - '%chatPlugin% &eTop players with the most balance in the bank:'
      - '&eTOP  -  PLAYER  -  BANK  -  LEVEL  -  BALANCE'
    entry: '&aTop %topBankPosition%: &f%topPlayerName% - %topBankName% - %topBankLevel% - %topBankBalance%'

  receive:
