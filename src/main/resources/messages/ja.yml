messages:

  # コマンド /minebank help
  help:
    - '&b<-----------------&aMINEBANK管理者コマンド&b----------------->'
    - '&e/minebank help &7- マインバンクのヘルプを表示'
    - '&e/minebank reload &7- プラグインの設定をリロード'
    - '&e/minebank info &7- プラグイン情報を表示'
    - '&e/minebank permissions &7- プラグインの権限を表示'
    - '&7別名: &eminebank&7, &emb'
    - '&e/bank help &7- 銀行のヘルプを表示'
    - '&e/bank set <プレイヤー> balance <金額> &7- プレイヤーの残高を設定'
    - '&e/bank set <プレイヤー> balance mid-max &7- プレイヤーの銀行残高を最大の半分に設定'
    - '&e/bank set <プレイヤー> balance max &7- プレイヤーの銀行残高を最大に設定'
    - '&e/bank set <プレイヤー> level <金額> &7- プレイヤーのレベルを設定'
    - '&e/bank set <プレイヤー> level mid-max &7- プレイヤーの銀行レベルを最大の半分に設定'
    - '&e/bank set <プレイヤー> level max &7- プレイヤーの銀行レベルを最大に設定'
    - '&e/bank add <プレイヤー> <金額> &7- プレイヤーの銀行残高に金額を追加'
    - '&e/bank take <プレイヤー> <金額> &7- プレイヤーの銀行残高から金額を引き出し'

  # コマンド /minebank reload
  reload: '%plugin% &aプラグインが再読み込みされました。'

  # コマンド /minebank info
  info:
    - '&b&l--> --> %plugin% &e&l情報 &b&l<-- <--'
    - '&6&l>> &eプラグインバージョン: &b%version%'
    - '&6&l>> &eプラグインデータストレージ: &b%dataStorage%'
    - '&b&l····· &aプラグインフック &b&l·····'
    - '%pluginHooksList%'

  # コマンド /minebank permissions
  permissions:
    - '&b<-----------------&aMINEBANK パーミッション&b----------------->'
    - '&eminebank.admin &7- すべての権限'
    - '&eminebank.updatechecker &7- アップデートがある場合、メッセージを受信する許可'
    - '&eminebank.bank.use &7- プレイヤーが銀行を使用できるようにする'
    - '&eminebank.bank.<銀行名> &7- 銀行 <銀行名> をプレイヤーに設定する'

  command-no-argument: '%plugin% &7/e/minebank help &7でコマンド一覧を確認してください。'

  no-perm: '%chatPlugin% &cそのコマンドを使用する権限がありません。'

  console-error: '%plugin% &cコンソールではそのコマンドを使用できません。'

config:

  # 設定で「config.update-checker: true」が有効の場合
  # このメッセージはOPプレイヤーまたは
  # 「minebank.updatechecker」または「minebank.admin」権限を持つプレイヤーにのみ表示されます
  update-checker:
    - '&b&l--> --> %plugin% &e&lアップデートチェッカー &b&l<-- <--'
    - '&b新しいバージョンが利用可能です。 &f(&e%latestVersion%&f)。'
    - '&bここからダウンロードできます: &f%link%'
    - '&bいくつかのアップデートは手動で変更する必要があります。'
    - '&b変更履歴を読む: &f%link%/updates'

  # 設定で「config.bank-allowed: false」が有効の場合
  # 銀行コマンドを使用したときに、このメッセージがチャットに表示されます
  bank-disabled: '%chatPlugin% &c銀行は一時的に無効です。'

bank:

  # コマンド /bank help
  help:
    - '&b<-----------------&aMINEBANKコマンド&b----------------->'
    - '&e/bank &7- GUIを開く (1.13+)'
    - '&e/bank help &7- 銀行のヘルプを表示'
    - '&e/bank data &7- あなたの銀行データ（名前、レベル、残高）を表示'
    - '&e/bank data [プレイヤー] &7- プレイヤーの銀行データ（名前、レベル、残高）を表示'
    - '&e/bank add <金額> &7- 指定した金額を預ける'
    - '&e/bank add half-balance &7- 現在の銀行残高の半分を預ける'
    - '&e/bank add all &7- 残高全部を預ける、または最大残高まで預ける'
    - '&e/bank add mid-max &7- 最大残高の半分を預ける'
    - '&e/bank take <金額> &7- 指定した金額を引き出す'
    - '&e/bank take half-balance &7- 現在の銀行残高の半分を引き出す'
    - '&e/bank take all &7- 銀行残高を全て引き出す'
    - '&e/bank take mid-max &7- 最大残高の半分を引き出す'
    - '&e/bank levelup &7- 銀行のレベルを上げる'
    - '&e/bank top &7- 最もお金を持っている上位プレイヤーを表示'
    - '&e/bank top [金額] &7- 上位[金額]人のプレイヤーを表示'
    - '&e/bank receive profit &7- オフラインで蓄積された利益を受け取る'

  general-usage: '%chatPlugin% &e使用法: /bank {help/data/add/take/levelup/top/receive/set}'
  data-usage: '%chatPlugin% &e使用法: /bank data [プレイヤー]'
  add-usage: '%chatPlugin% &e使用法: /bank {add/deposit} {<金額>/half-balance/all/mid-max}'
  take-usage: '%chatPlugin% &e使用法: /bank {take/withdraw} {<金額>/half-balance/all/mid-max}'
  levelup-usage: '%chatPlugin% &e使用法: /bank levelup'
  baltop-usage: '%chatPlugin% &e使用法: /bank {top/baltop/balancetop} [金額]'
  set-usage: '%chatPlugin% &e使用法: /bank set <プレイヤー> {balance/level} {<金額>/mid-max/max}'
  receive-usage: '%chatPlugin% &e使用法: /bank receive profit'

  data:
    player-bank-data:
      - '%chatPlugin% &e&lあなたの銀行データ：'
      - '&6&l>> &e名前：&a%playerBankName%'
      - '&6&l>> &eレベル：&a%playerBankLevel%&e/&a%playerBankMaxLevel%'
      - '&6&l>> &e残高：&a%moneySymbol%%playerBankBalance%&e/&a%moneySymbol%%playerBankMaxBalance%'
    target-bank-data:
      - '%chatPlugin% &e&l%targetPlayerName%の銀行データ：'
      - '&6&l>> &e名前：&a%targetBankName%'
      - '&6&l>> &eレベル：&a%targetBankLevel%&e/&a%targetBankMaxLevel%'
      - '&6&l>> &e残高：&a%moneySymbol%%targetBankBalance%&e/&a%moneySymbol%%targetBankMaxBalance%'

  add:
    deposit-success: '%chatPlugin% &a%moneySymbol%%amount%をあなたの銀行に預けました。'
    deposit-exceeds: '%chatPlugin% &c現在の銀行レベルでは%moneySymbol%%playerBankMaxBalance%以上は預けられません。'
    deposit-failure: '%chatPlugin% &c金額は正の整数でなければなりません。'
    not-enough-bank-balance: '%chatPlugin% &cその金額を預けるには十分な残高がありません。'
    target-deposit-success: '%chatPlugin% &a%moneySymbol%%amount%を%targetPlayerName%の銀行に預けました。'
    target-deposit-exceeds: '%chatPlugin% &c%targetPlayerName%の銀行では%moneySymbol%%targetBankMaxBalance%以上は預けられません。'
    target-deposit-failure: '%chatPlugin% &c金額は正の整数でなければなりません。'

  take:
    withdraw-success: '%chatPlugin% &a%moneySymbol%%amountReceived%をあなたの銀行から引き出しました。銀行手数料は%moneySymbol%%amountDeducted%です。銀行の利息は%interestPercentage%%です。'
    withdraw-exceeds: '%chatPlugin% &c利息のためその金額を引き出せません。'
    withdraw-failure: '%chatPlugin% &c金額は正の整数でなければなりません。'
    not-enough-bank-balance: '%chatPlugin% &c銀行にその金額を引き出すための十分な残高がありません。'
    target-withdraw-success: '%chatPlugin% &a%targetPlayerName%の銀行から%moneySymbol%%amount%を引き出しました。'
    target-withdraw-failure: '%chatPlugin% &c金額は正の整数でなければなりません。'
    target-not-enough-bank-balance: '%chatPlugin% &c%targetPlayerName%の銀行に十分な残高がありません。'

  levelup:
    levelup-success: '%chatPlugin% &aレベル %playerBankLevel% に正常にレベルアップしました。これで合計 %moneySymbol%%playerBankMaxBalance% を保存できます。'
    already-max-level: '%chatPlugin% &cすでに銀行の最大レベルに達しています。'
    not-enough-bank-balance: '%chatPlugin% &cレベルアップするためには銀行に十分な残高が必要です。%moneySymbol%%playerBankNextLevelCost% が必要です。'

  top:
    title: '%chatPlugin% &e銀行で最も多くの残高を持つプレイヤー：'
    entry: '&aトップ %topBankPosition%: &f%topPlayerName% - %topBankName% - %topBankLevel% - %moneySymbol%%topBankBalance%'
    baltop-failure: '%chatPlugin% &c金額は正の整数でなければなりません。'

  receive:
    offline-received-success: '%chatPlugin% &aオフラインで %moneySymbol%%offlineProfitAmount% の利益を受け取りました。'
    receive-exceeds: '%chatPlugin% &c現在の銀行レベルでは %moneySymbol%%playerBankMaxBalance% より多くは保存できません。'
    offline-not-profit: '%chatPlugin% &c累積されたオフライン利益がありません。'

  set:
    set-balance-success: '%chatPlugin% &a%targetPlayerName% の銀行残高を %moneySymbol%%amount% に設定しました。'
    max-balance: '%chatPlugin% &c残高は %moneySymbol%%targetBankMaxBalance% を超えることはできません。'
    set-level-success: '%chatPlugin% &a%targetPlayerName% の銀行レベルを %amount% に設定しました。'
    max-level: '%chatPlugin% &cレベルは %targetBankMaxLevel% を超えることはできません。'
    set-amount-failure: '%chatPlugin% &c金額は正の整数でなければなりません。'
    target-player-not-found: '%chatPlugin% &cプレイヤー %targetPlayerName% が見つかりませんでした。'

  profit:
    received: '%chatPlugin% &a銀行にお金を預けて、%moneySymbol%%keepInBankProfit% の利益を受け取りました！銀行の利益率は: %profitPercentage%%'
    min-storage: '%chatPlugin% &c利益を得るためには、銀行に少なくとも %moneySymbol%%minBankBalanceToReceiveProfit% が必要です。'
    max-storage: '%chatPlugin% &c利益を得続けるには、銀行からお金を引き出す必要があります。'
    offline-accumulated: '%chatPlugin% &aオフラインの間に銀行は %moneySymbol%%offlineProfitAmount% の利益を蓄積しました。受け取るには &e/bank receive profit を使用してください。'

  gui:
    amount-withdraw: '%chatPlugin% &a引き出す金額を入力するか、「exit」と入力してキャンセルしてください：'
    amount-deposit: '%chatPlugin% &a預ける金額を入力するか、「exit」と入力してキャンセルしてください：'
    amount-selected: '%chatPlugin% &a選択した金額：'
    invalid-amount: '%chatPlugin% &c無効な金額です。再試行してください。'
    transaction-canceled: '%chatPlugin% &c取引がキャンセルされました。'