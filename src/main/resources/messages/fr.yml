messages:

  # Commande /minebank help
  help:
    - '&b<-----------------&aCOMMANDES MINEBANK ADMIN&b----------------->'
    - '&e/minebank help &7- Afficher ce message'
    - '&e/minebank reload &7- Recharger la configuration du plugin'
    - '&e/minebank info &7- Afficher les informations du plugin'
    - '&e/minebank permissions &7- Afficher les permissions du plugin'
    - '&7Alias: &eminebank&7, &emb'
    - '&e/bank help &7- Afficher l`aide bancaire'
    - '&e/bank set <joueur> balance <montant> &7- Définir le solde du joueur à ce montant'
    - '&e/bank set <joueur> balance mid-max &7- Définir la moitié du solde maximal de la banque pour le joueur'
    - '&e/bank set <joueur> balance max &7- Définir le solde maximal de la banque pour le joueur'
    - '&e/bank set <joueur> level <montant> &7- Définir le niveau du joueur à ce montant'
    - '&e/bank set <joueur> level mid-max &7- Définir la moitié du niveau maximal de la banque pour le joueur'
    - '&e/bank set <joueur> level max &7- Définir le niveau maximal de la banque pour le joueur'
    - '&e/bank add <joueur> <montant> &7- Ajoute un montant au solde bancaire du joueur'
    - '&e/bank take <joueur> <montant> &7- Retire un montant du solde bancaire du joueur'

  # Commande /minebank reload
  reload: '%plugin% &aLe plugin a été rechargé.'

  # Commande /minebank info
  info:
    - '&b&l--> --> %plugin% &e&lInfo &b&l<-- <--'
    - '&6&l>> &eVersion du plugin: &b%version%'
    - '&6&l>> &eStockage des données du plugin: &b%dataStorage%'
    - '&b&l····· &aHooks du plugin &b&l·····'
    - '%pluginHooksList%'

  # Commande /minebank permissions
  permissions:
    - '&b<-----------------&aPERMISSIONS MINEBANK&b----------------->'
    - '&eminebank.admin &7- Toutes les permissions'
    - '&eminebank.updatechecker &7- Autoriser la réception du message s`il y a une mise à jour'
    - '&eminebank.bank.use &7- Autoriser les joueurs à utiliser la banque'
    - '&eminebank.bank.<NomDeLaBanque> &7- Attribuer la banque <NomDeLaBanque> au joueur'

  command-no-argument: '%plugin% &7Utilisez &e/minebank help &7pour voir la liste des commandes.'

  no-perm: '%chatPlugin% &cVous n`avez pas la permission d`utiliser cette commande.'

  console-error: '%plugin% &cVous ne pouvez pas utiliser cette commande dans la console.'

config:

  # Si dans la configuration, la clé "config.update-checker: true"
  # Ce message sera affiché dans le chat uniquement pour les joueurs OP, ou
  # les joueurs ayant la permission "minebank.updatechecker" ou "minebank.admin"
  update-checker:
    - '&b&l--> --> %plugin% &e&lVérificateur de mise à jour &b&l<-- <--'
    - '&bUne nouvelle version est disponible. &f(&e%latestVersion%&f).'
    - '&bTéléchargez-la ici : &f%link%'
    - '&bCertaines mises à jour peuvent nécessiter de changer certaines choses manuellement.'
    - '&bLire le changelog : &f%link%/updates'

  # Si dans la configuration, la clé "config.bank-allowed: false"
  # Ce message sera affiché dans le chat lorsque vous utilisez une commande de banque
  bank-disabled: '%chatPlugin% &cLa banque est temporairement désactivée.'

bank:

  # Commande /bank help
  help:
    - '&b<-----------------&aCOMMANDES MINEBANK&b----------------->'
    - '&e/bank &7- Ouvrir l`interface (1.13+)'
    - '&e/bank help &7- Afficher l`aide de la banque'
    - '&e/bank data &7- Afficher vos données bancaires comme nom, niveau et solde'
    - '&e/bank data [joueur] &7- Afficher les données bancaires du joueur comme nom, niveau et solde'
    - '&e/bank add <montant> &7- Déposer un montant d`argent'
    - '&e/bank add half-balance &7- Déposer la moitié de votre solde actuel'
    - '&e/bank add all &7- Déposer tout votre solde ou jusqu`à votre solde maximal'
    - '&e/bank add mid-max &7- Déposer la moitié de votre solde bancaire maximal'
    - '&e/bank take <montant> &7- Retirer un montant d`argent'
    - '&e/bank take half-balance &7- Retirer la moitié de votre solde actuel'
    - '&e/bank take all &7- Retirer tout votre solde bancaire'
    - '&e/bank take mid-max &7- Retirer la moitié de votre solde bancaire maximal'
    - '&e/bank levelup &7- Augmenter le niveau de votre banque'
    - '&e/bank top &7- Afficher les meilleurs joueurs avec le plus d`argent'
    - '&e/bank top [montant] &7- Afficher les meilleurs joueurs avec le plus d`argent, limité à [montant]'
    - '&e/bank receive profit &7- Recevoir les bénéfices accumulés hors ligne'

  general-usage: '%chatPlugin% &eUtilisation: /bank {help/data/add/take/levelup/top/receive/set}'
  data-usage: '%chatPlugin% &eUtilisation: /bank data [joueur]'
  add-usage: '%chatPlugin% &eUtilisation: /bank {add/deposit} {<montant>/half-balance/all/mid-max}'
  take-usage: '%chatPlugin% &eUtilisation: /bank {take/withdraw} {<montant>/half-balance/all/mid-max}'
  levelup-usage: '%chatPlugin% &eUtilisation: /bank levelup'
  baltop-usage: '%chatPlugin% &eUtilisation: /bank {top/baltop/balancetop} [montant]'
  set-usage: '%chatPlugin% &eUtilisation: /bank set <joueur> {balance/level} {<montant>/mid-max/max}'
  receive-usage: '%chatPlugin% &eUtilisation: /bank receive profit'

  data:
    player-bank-data:
      - '%chatPlugin% &e&lVos données bancaires :'
      - '&6&l>> &eNom : &a%playerBankName%'
      - '&6&l>> &eNiveau : &a%playerBankLevel%&e/&a%playerBankMaxLevel%'
      - '&6&l>> &eSolde : &a%moneySymbol%%playerBankBalance%&e/&a%moneySymbol%%playerBankMaxBalance%'
    target-bank-data:
      - '%chatPlugin% &e&lDonnées bancaires de %targetPlayerName% :'
      - '&6&l>> &eNom : &a%targetBankName%'
      - '&6&l>> &eNiveau : &a%targetBankLevel%&e/&a%targetBankMaxLevel%'
      - '&6&l>> &eSolde : &a%moneySymbol%%targetBankBalance%&e/&a%moneySymbol%%targetBankMaxBalance%'

  add:
    deposit-success: '%chatPlugin% &aVous avez déposé %moneySymbol%%amount% dans votre banque.'
    deposit-exceeds: '%chatPlugin% &cVous ne pouvez pas stocker plus que %moneySymbol%%playerBankMaxBalance% à votre niveau actuel de banque.'
    deposit-failure: '%chatPlugin% &cLe montant doit être positif et un nombre entier.'
    not-enough-bank-balance: '%chatPlugin% &cVous n`avez pas assez de solde pour déposer ce montant.'
    target-deposit-success: '%chatPlugin% &aVous avez déposé %moneySymbol%%amount% dans la banque de %targetPlayerName%.'
    target-deposit-exceeds: '%chatPlugin% &cLa banque de %targetPlayerName% ne peut pas stocker plus que %moneySymbol%%targetBankMaxBalance%'
    target-deposit-failure: '%chatPlugin% &cLe montant doit être positif et un nombre entier.'

  take:
    withdraw-success: '%chatPlugin% &aVous avez retiré %moneySymbol%%amountReceived% de votre banque. Les frais bancaires sont : %moneySymbol%%amountDeducted%. Les intérêts bancaires sont : %interestPercentage%%'
    withdraw-exceeds: '%chatPlugin% &cVous ne pouvez pas retirer ce montant à cause des intérêts.'
    withdraw-failure: '%chatPlugin% &cLe montant doit être positif et un nombre entier.'
    not-enough-bank-balance: '%chatPlugin% &cVous n`avez pas assez de solde dans votre banque pour retirer ce montant.'
    target-withdraw-success: '%chatPlugin% &aVous avez retiré %moneySymbol%%amount% de la banque de %targetPlayerName%.'
    target-withdraw-failure: '%chatPlugin% &cLe montant doit être positif et un nombre entier.'
    target-not-enough-bank-balance: '%chatPlugin% &cLa banque de %targetPlayerName% n`a pas assez de solde.'

  levelup:
    levelup-success: '%chatPlugin% &aVous avez réussi à monter de niveau jusqu`au niveau %playerBankLevel%, vous pouvez maintenant stocker un total de %moneySymbol%%playerBankMaxBalance%'
    already-max-level: '%chatPlugin% &cVous êtes déjà au niveau maximum de la banque.'
    not-enough-bank-balance: '%chatPlugin% &cVous n`avez pas assez de solde dans la banque pour monter de niveau, vous avez besoin de %moneySymbol%%playerBankNextLevelCost%'

  top:
    title: '%chatPlugin% &eTop des joueurs avec le plus de solde dans la banque :'
    entry: '&aTop %topBankPosition% : &f%topPlayerName% - %topBankName% - %topBankLevel% - %moneySymbol%%topBankBalance%'
    baltop-failure: '%chatPlugin% &cLe montant doit être un nombre entier positif.'

  receive:
    offline-received-success: '%chatPlugin% &aVous avez reçu %moneySymbol%%offlineProfitAmount% en bénéfices hors ligne.'
    receive-exceeds: '%chatPlugin% &cVous ne pouvez pas stocker plus de %moneySymbol%%playerBankMaxBalance% avec votre niveau actuel de banque.'
    offline-not-profit: '%chatPlugin% &cVous n`avez aucun bénéfice hors ligne accumulé.'
  
  set:
    set-balance-success: '%chatPlugin% &aLe solde de la banque de %targetPlayerName% a été défini sur %moneySymbol%%amount%'
    max-balance: '%chatPlugin% &cLe solde ne peut pas être supérieur à %moneySymbol%%targetBankMaxBalance%'
    set-level-success: '%chatPlugin% &aLe niveau de la banque de %targetPlayerName% a été défini sur %amount%'
    max-level: '%chatPlugin% &cLe niveau ne peut pas être supérieur à %targetBankMaxLevel%'
    set-amount-failure: '%chatPlugin% &cLe montant doit être un nombre entier positif.'
    target-player-not-found: '%chatPlugin% &cLe joueur %targetPlayerName% n’a pas été trouvé.'

  profit:
    received: '%chatPlugin% &aVous avez reçu %moneySymbol%%keepInBankProfit% pour avoir gardé votre argent à la banque ! Le profit bancaire est de : %profitPercentage%%'
    min-storage: '%chatPlugin% &cVous devez avoir au moins %moneySymbol%%minBankBalanceToReceiveProfit% dans la banque pour commencer à gagner des bénéfices.'
    max-storage: '%chatPlugin% &cVous devez retirer de l’argent de la banque pour continuer à gagner des bénéfices.'
    offline-accumulated: '%chatPlugin% &aVotre banque a accumulé %moneySymbol%%offlineProfitAmount% de solde pendant que vous étiez hors ligne, pour le collecter utilisez &e/bank receive profit.'

  gui:
    amount-withdraw: '%chatPlugin% &aInsérez le montant à retirer ou tapez "exit" pour annuler :'
    amount-deposit: '%chatPlugin% &aInsérez le montant à déposer ou tapez "exit" pour annuler :'
    amount-selected: '%chatPlugin% &aMontant sélectionné :'
    invalid-amount: '%chatPlugin% &cMontant invalide. Essayez à nouveau.'
    transaction-canceled: '%chatPlugin% &cTransaction annulée.'