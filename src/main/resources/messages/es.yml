    - '&e/bank add half-balance &7- Deposita la mitad de tu dinero actual'
    - '&e/bank add all &7- Deposita todo tu dinero o hasta llegar al máximo de capacidad del banco'
    - '&e/bank add mid-max &7- Deposita la mitad del máximo de capacidad de dinero del banco'
    - '&6/bank add player <jugador> <cantidad> &7- Añade al saldo bancario del jugador una cantidad'
    - '&e/bank take <cantidad> &7- Retira del saldo bancario del jugador una cantidad'
    - '&e/bank take half-balance &7- Recoge la mitad de tu dinero del banco actual'
    - '&e/bank take all &7- Recoge todo tu dinero del banco'
    - '&e/bank take mid-max &7- Recoge la mitad del máximo de tu dinero del banco'
    - '&6/bank take player <jugador> <cantidad> &7- Recoge una cantidad de dinero del banco del jugador'
    - '&6/bank set <jugador> balance <cantidad> &7- Establece el saldo bancario al jugador'
    - '&6/bank set <jugador> balance mid-max &7- Establece la mitad del saldo bancario máximo al jugador'
    - '&6/bank set <jugador> balance max &7- Establece el saldo bancario máximo al jugador'
    - '&6/bank set <jugador> level <cantidad> &7- Establece el nivel bancario al jugador'
    - '&6/bank set <jugador> level mid-max &7- Establece la mitad del nivel bancario máximo al jugador'
    - '&6/bank set <jugador> level max &7- Establece el nivel bancario máximo al jugador'
    - '&e/bank levelup &7- Sube de nivel tu banco'
    - '&6/bank levelup <jugador> &7- Sube el nivel del banco del jugador'
    - '&e/bank top &7- Muestra el top de jugadores con más dinero'
    - '&e/bank top <cantidad> &7- Muestra una cantidad de jugadores del top con más dinero'
    - '&e/bank top player <jugador> &7- Muestra la posición del top y los datos del banco del jugador'
    - '&e/bank receive profit &7- Recibe los beneficios acumulados por estar desconectado'
    - '&e/bank transactions [página] &7- Abre el GUI con historial de transacciones'
    - '&e/bank events &7- Abre el GUI de eventos'
    - '&e/bank gui <GUI> &7- Abre el inventario seleccionado'
    - '&e/bank web &7- Abre tu panel web'

  reload: '%plugin% &aEl plugin ha sido recargado'

  info:
    - '&b&l--> --> %plugin% &e&lInformación &b&l<-- <--'
    - '&6&l>> &eVersión del plugin: &b%version%'
    - '&6&l>> &eAlmacenamiento de datos: &b%dataStorage%'
    - '&b&l····· &aConexiones del plugin &b&l·····'
    - '%pluginHooksList%'

  permissions:
    - '&b<-----------------&aPERMISOS MINEBANK&b----------------->'
    - '&6minebank.admin &7- Todos los permisos'
    - '&6minebank.migration &7- Permite migrar los datos del plugin a otro sistema de base de datos'
    - '&6minebank.backup &7- Permite hacer una copia de seguridad de los datos del plugin'
    - '&6minebank.updatechecker &7- Permite recibir notificación si hay una actualización'
    - '&eminebank.bank.use &7- Permite a los jugadores usar comandos del banco'
    - '&eminebank.bank.<nombreBanco> &7- Permite al jugador tener el banco <nombreBanco>'

  command-no-argument: '%plugin% &7Usa &e/minebank help &7para ver la lista de comandos'
  no-perm: '%chatPlugin% &cNo tienes permiso para usar ese comando'
  console-error: '%plugin% &cNo puedes usar ese comando en la consola'
  processing-command-error: '%plugin% &cHa ocurrido un error al procesar el comando'

config:

  # Si en la configuración la clave "config.update-checker: true"
  # Este mensaje se mostrará solo a jugadores OP o jugadores con
  # permiso "minebank.updatechecker" o "minebank.admin"
  update-checker:
    - '&b&l--> --> %plugin% &e&lComprobador de Actualizaciones &b&l<-- <--'
    - '&bHay una nueva versión disponible. &f(&e%latestVersion%&f)'
    - '&bDescárgala aquí: &f%link%'
    - '&bLee los cambios: &f%link%/updates'

  # Si en la configuración la clave "config.bank-allowed: false"
  # Este mensaje se mostrará al intentar usar cualquier comando del banco
  bank-disabled: '%chatPlugin% &cEl banco está deshabilitado temporalmente'

bank:

  help:
    - '&b<-----------------&aCOMANDOS MINEBANK&b----------------->'
    - '&e/bank &7- Abre el inventario principal del banco (1.13+)'
    - '&e/bank help &7- Muestra la ayuda del banco'
    - '&e/bank data &7- Muestra tu información bancaria: nombre, nivel y saldo'
    - '&e/bank data <jugador> &7- Muestra la información bancaria de un jugador'
    - '&e/bank add <cantidad> &7- Deposita una cantidad de dinero'
    - '&e/bank add half-balance &7- Deposita la mitad de tu dinero actual'
    - '&e/bank add all &7- Deposita todo tu dinero o hasta llegar al máximo de capacidad del banco'
    - '&e/bank add mid-max &7- Deposita la mitad del máximo de capacidad de dinero del banco'
    - '&e/bank take <cantidad> &7- Retira del saldo bancario del jugador una cantidad'
    - '&e/bank take half-balance &7- Recoge la mitad de tu dinero del banco actual'
    - '&e/bank take all &7- Recoge todo tu dinero del banco'
    - '&e/bank take mid-max &7- Recoge la mitad del máximo de tu dinero del banco'
    - '&e/bank levelup &7- Sube de nivel tu banco'
    - '&e/bank top &7- Muestra el top de jugadores con más dinero'
    - '&e/bank top <cantidad> &7- Muestra una cantidad de jugadores del top con más dinero'
    - '&e/bank top player <jugador> &7- Muestra la posición del top y los datos del banco del jugador'
    - '&e/bank receive profit &7- Recibe los beneficios acumulados por estar desconectado'
    - '&e/bank transactions [página] &7- Abre el historial de transacciones con paginación'
    - '&e/bank events &7- Abre el GUI de eventos'
    - '&e/bank gui <GUI> &7- Abre el inventario seleccionado del plugin'
    - '&e/bank web &7- Abre tu panel web'

  # Para migrar de JSON a MYSQL (/minebank migrate JSON-MYSQL)
  # Para usar el nuevo sistema de base de datos asegúrate de cambiarlo en config.yml en la sección "bank.data.type" después de hacer la migración
  migrate:
    usage-admin:
      - '%chatPlugin% &eUso:'
      - '&6/minebank migrate {<FROM>-<TO>} &7- Migrar datos a otro sistema de base de datos'
      - '&6/minebank migrate confirm &7- Confirmar migración'
      - '&7Alias: &eminebank&7, &emb'
    not-supported: '%plugin% &cEsa migración no está soportada'
    same-storage-type:
      - '%plugin% &cError: Ambos almacenamientos son el mismo'
      - '%plugin% &7 Puedes hacer una copia de seguridad con &e/minebank backup'
    not-current-data-type: '%plugin% &cError: %MIGRATEDFROM% no es actualmente el valor de "bank.data.type" en la config'
    success:
      - '%plugin% &aSe ha completado la migración de %MIGRATEDFROM% a %MIGRATEDTO%!'
      - '%plugin% &7Jugadores: %MIGRATEDPLAYERS%, Bancos: %MIGRATEDBANKS%, Intereses: %MIGRATEDINTERESTS%, Transacciones: %MIGRATEDTRANSACTIONS%, Tiempo: %MIGRATIONTIME%'
      - '%plugin% &eModifica el valor de "bank.data.type" en la config para usar %MIGRATEDTO% y reinicia el servidor'
    failed: '%plugin% &cFallo al hacer la migración: Error %MIGRATIONERROR%'
    failed-connection: '%plugin% &cFallo al hacer la migración: %MIGRATEDTO%. No se puedo establecer la conexión, comprueba los valores de "bank.data" en la config'
    failed-credentials: '%plugin% &cFallo al hacer la migración: %MIGRATEDTO%. Las credenciales están vacías o mal formadas'
    confirm-needed:
      - '%plugin% &7Usa &a/minebank migrate confirm &7para continuar con la migración'
      - '%plugin% &eEs altamente recomendado hacer una copia de seguridad antes de confirmar la migración y verificar que se haya echo correctamente'
      - '%plugin% &7Usa &e/minebank backup &7para hacer una copia de seguridad'
    confirm-expired: '%plugin% &cLa migración se ha cancelado automáticamente'
    no-pending: '%plugin% &cNo tienes migraciones pendientes'

  backup:
    usage-admin:
      - '%chatPlugin% &eUso:'
      - '&6/minebank backup &7- Hacer copia de seguridad de los datos del plugin'
      - '&7Alias: &eminebank&7, &emb'
    success: '%plugin% &aCopia de seguridad completada. Usando %datastorage%'
    failed: '%plugin% &cFallo al hacer copia de seguridad'

  event:
    usage-admin:
      - '%chatPlugin% &eUso:'
      - '&6/minebank event {profit/tax} <multiplicador> <duración> &7- Inicia un evento especial'
      - '&6/minebank event {profit/tax} cancel &7- Cancela un evento especial'
      - '&7Alias: &eminebank&7, &emb'
    invalid-multiplier: '%plugin% &cMultiplicador inválido. Usa formato x2, x0.6, x4.25'
    invalid-duration: '%plugin% &cDuración inválida. Usa 10s, 25m, 3h, 4d, 1w'
    started: '%plugin% &aEvento %type% iniciado: x%multiplier% por %duration%'
    cancelled: '%plugin% &eEvento %type% cancelado'
    not-active: '%plugin% &cNo hay evento %type% activo'

  manage:
    usage-admin:
      - '%chatPlugin% &eUso:'
      - '&6/minebank bank create <newbankname> &7- Crea un nuevo banco'
      - '&6/minebank bank rename <oldname> <newname> &7- Renombra un banco'
      - '&6/minebank bank add <bankname> level <newlevel> max_balance <value> upgrade_cost <value> &7- Añade un nivel al banco'
      - '&6/minebank bank modify <bankname> level <value> max_balance <value> &7- Modifica el máximo balance del nivel'
      - '&6/minebank bank modify <bankname> level <value> upgrade_cost <value> &7- Modifica el costo de mejora del nivel'
      - '&6/minebank bank modify <bankname> priority <value> &7- Cambia la prioridad del banco'
      - '&6/minebank bank delete <bankname> level <value> &7- Elimina un nivel del banco'
      - '&6/minebank bank delete <bankname> &7- Elimina un banco (requiere confirmación)'
      - '&6/minebank bank delete confirm &7- Confirmar eliminación de banco'
      - '&7Alias: &eminebank&7, &emb'
    bank-exists: '%chatPlugin% &cEl banco %bankName% ya existe'
    bank-not-found: '%chatPlugin% &cEl banco %bankName% no existe'
    bank-renamed: '%chatPlugin% &aBanco %bankName% renombrado a %newBankName%'
    invalid-bank-name: '%chatPlugin% &cNombre de banco inválido. Usa 3+ caracteres con letras, números, _ o +'
    upgrade-cost-too-high: '%chatPlugin% &cEl coste de mejora no puede ser mayor que el balance máximo'
    bank-created: '%chatPlugin% &aBanco %bankName% creado'
    bank-deleted: '%chatPlugin% &aBanco %bankName% eliminado'
    level-added: '%chatPlugin% &aAñadido nivel %level% al banco %bankName%'
    level-modified: '%chatPlugin% &aNivel %level% del banco %bankName% actualizado'
    level-deleted: '%chatPlugin% &aNivel %level% eliminado del banco %bankName%'
    level-not-found: '%chatPlugin% &cNivel %level% no encontrado en el banco %bankName%'
    level-last-cannot-delete: '%chatPlugin% &cNo puedes eliminar el último nivel del banco %bankName%'
    priority-updated: '%chatPlugin% &aPrioridad del banco %bankName% establecida a %priority%'
    delete-confirm-needed:
      - '%chatPlugin% &7Usa &a/minebank bank delete confirm &7para eliminar %bankName%'
      - '%chatPlugin% &eEsta confirmación caduca en 10 segundos'
    delete-confirm-expired: '%chatPlugin% &cLa eliminación del banco ha sido cancelada automáticamente'
    delete-no-pending: '%chatPlugin% &cNo tienes eliminaciones de banco pendientes'

  item:
    usage-admin:
      - '%chatPlugin% &eUso:'
      - '&6/minebank item list &7- Muestra todos los ids de items guardados'
      - '&6/minebank item save <customItemID> &7- Guarda el item de tu mano'
      - '&6/minebank item get <customItemID> [amount] &7- Recibe un item guardado'
      - '&6/minebank item rename <customItemID> <newCustomItemID> &7- Prepara un renombrado'
      - '&6/minebank item replace <customItemID> &7- Prepara reemplazarlo por el item de tu mano'
      - '&6/minebank item delete <customItemID> &7- Prepara borrar un item personalizado'
      - '&6/minebank item <rename|replace|delete> <confirm|cancel> &7- Confirmar o cancelar'
    list-header: '%chatPlugin% &eItems personalizados guardados: &f%amount%'
    list-entry: '&6- &e%customItemID%'
    list-empty: '%chatPlugin% &cNo hay items personalizados guardados'
    invalid-id: '%chatPlugin% &cID de item personalizado inválido &e%customItemID%&c. Usa letras, números, _ o -'
    invalid-new-id: '%chatPlugin% &cNuevo ID de item personalizado inválido &e%newCustomItemID%&c. Usa letras, números, _ o -'
    already-exists: '%chatPlugin% &cEse ID de item personalizado ya existe: &e%customItemID%'
    target-exists: '%chatPlugin% &cEl ID de destino ya existe: &e%newCustomItemID%'
    hand-empty: '%chatPlugin% &cDebes tener un item en la mano principal'
    saved: '%chatPlugin% &aItem personalizado guardado: &e%customItemID%'
    not-found: '%chatPlugin% &cItem personalizado no encontrado: &e%customItemID%'
    load-failed: '%chatPlugin% &cNo se pudo cargar el item personalizado: &e%customItemID%'
    received: '%chatPlugin% &aHas recibido el item personalizado &e%customItemID% &7x%amount%'
    rename-confirm-needed:
      - '%chatPlugin% &7Usa &a/minebank item rename confirm &7para renombrar &e%customItemID% &7a &e%newCustomItemID%'
      - '%chatPlugin% &eUsa &c/minebank item rename cancel &epara cancelar'
    replace-confirm-needed:
      - '%chatPlugin% &7Usa &a/minebank item replace confirm &7para reemplazar &e%customItemID%'
      - '%chatPlugin% &eUsa &c/minebank item replace cancel &epara cancelar'
    delete-confirm-needed:
      - '%chatPlugin% &7Usa &a/minebank item delete confirm &7para eliminar &e%customItemID%'
      - '%chatPlugin% &eUsa &c/minebank item delete cancel &epara cancelar'
    no-pending: '%chatPlugin% &cNo tienes ninguna acción pendiente de item personalizado'
    cancelled: '%chatPlugin% &eSe canceló la acción pendiente del item personalizado'
    renamed: '%chatPlugin% &aItem personalizado renombrado de &e%customItemID% &aa &e%newCustomItemID%'
    pending-item-invalid: '%chatPlugin% &cEl item pendiente para reemplazo ya no es válido'
    replaced: '%chatPlugin% &aItem personalizado reemplazado: &e%customItemID%'
    deleted: '%chatPlugin% &aItem personalizado eliminado: &e%customItemID%'
    confirm-expired: '%chatPlugin% &cLa acción pendiente del item personalizado ha expirado'
    gui:
      custom-item-not-found-name: '&cCustom item not found'
      custom-item-not-found-lore:
        - '&7ID: &f%customItemID%'
        - '&7GUI: &f%guiName%'
        - '&7Slot: &f%slot%'

  events:
    usage:
      - '%chatPlugin% &eUso:'
      - '&e/bank events &7- Abre el GUI de eventos'
    usage-admin:
      - '%chatPlugin% &eUso:'
      - '&e/bank events &7- Abre el GUI de eventos'
    gui-items:
      profit-title: '&aBeneficio x%multiplier%'
      tax-title: '&cImpuesto x%multiplier%'
      remaining: '&7Tiempo restante: &f%remaining%'

  general-usage: '%chatPlugin% &eUso: /bank {help/data/add/take/levelup/top/receive/transactions/events/web}'

  unregistered-player: '%chatPlugin% &cEl jugador no esta registrado'
  unregistered-bank: '%chatPlugin% &cEl banco no esta registrado correctamente'
  not-positive-integer: '%chatPlugin% &cEl valor debe ser un numero, positivo y entero'

  data:
    usage:
      - '%chatPlugin% &eUso:'
      - '&e/bank data &7- Muestra tu información bancaria: nombre, nivel y saldo'
      - '&e/bank data <jugador> &7- Muestra la información bancaria de un jugador'
    usage-admin:
      - '%chatPlugin% &eUso:'
      - '&e/bank data &7- Muestra tu información bancaria: nombre, nivel y saldo'
      - '&e/bank data <jugador> &7- Muestra la información bancaria de un jugador'
    bank-data:
      - '%chatPlugin% &e&lDatos del banco de %playerName%:'
      - '&6&l>> &eBanco: &a%playerBankName%'
      - '&6&l>> &eNivel: &a%playerBankLevel%&e/&a%playerBankMaxLevel%'
      - '&6&l>> &eSubir nivel precio: &a%playerBankNextLevelCost%'
      - '&6&l>> &eDinero: &a%playerBankBalance%&e/&a%playerBankMaxBalance%'

  add:
    usage:
      - '%chatPlugin% &eUso:'
      - '&e/bank add <cantidad> &7- Deposita una cantidad de dinero'
      - '&e/bank add half-balance &7- Deposita la mitad de tu dinero actual'
      - '&e/bank add all &7- Deposita todo tu dinero o hasta llegar al máximo de capacidad del banco'
      - '&e/bank add mid-max &7- Deposita la mitad del máximo de capacidad de dinero del banco'
    usage-admin:
      - '%chatPlugin% &eUso:'
      - '&e/bank add <cantidad> &7- Deposita una cantidad de dinero'
      - '&e/bank add half-balance &7- Deposita la mitad de tu dinero actual'
      - '&e/bank add all &7- Deposita todo tu dinero o hasta llegar al máximo de capacidad del banco'
      - '&e/bank add mid-max &7- Deposita la mitad del máximo de capacidad de dinero del banco'
