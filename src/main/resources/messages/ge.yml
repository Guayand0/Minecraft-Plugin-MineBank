messages:

  # Befehl /minebank help
  help:
    - '&b<-----------------&aMINEBANK ADMIN-BEFEHLE&b----------------->'
    - '&e/minebank help &7- MineBank Hilfe anzeigen'
    - '&e/minebank reload &7- Plugin-Konfiguration neu laden'
    - '&e/minebank info &7- Plugin-Informationen anzeigen'
    - '&e/minebank permissions &7- Plugin-Berechtigungen anzeigen'
    - '&7Aliase: &eminebank&7, &emb'
    - '&e/bank help &7- Bankhilfe anzeigen'
    - '&e/bank set <플레이어> balance <Betrag> &7- Das Kontoguthaben des Spielers festlegen'
    - '&e/bank set <Spieler> balance mid-max &7- Das Guthaben des Spielers auf die Hälfte des maximalen Bankguthabens setzen'
    - '&e/bank set <Spieler> balance max &7- Das maximale Bankguthaben des Spielers festlegen'
    - '&e/bank set <Spieler> level <Betrag> &7- Das Level des Spielers festlegen'
    - '&e/bank set <Spieler> level mid-max &7- Das Banklevel des Spielers auf die Hälfte des maximalen Levels setzen'
    - '&e/bank set <Spieler> level max &7- Das maximale Banklevel des Spielers festlegen'
    - '&e/bank add <Spieler> <Betrag> &7- Einen Betrag zum Bankguthaben des Spielers hinzufügen'
    - '&e/bank take <Spieler> <Betrag> &7- Einen Betrag vom Bankguthaben des Spielers abheben'

  # Befehl /minebank reload
  reload: '%plugin% &aDas Plugin wurde neu geladen.'

  # Befehl /minebank info
  info:
    - '&b&l--> --> %plugin% &e&lInfo &b&l<-- <--'
    - '&6&l>> &ePlugin-Version: &b%version%'
    - '&6&l>> &ePlugin-Daten-Speicherung: &b%dataStorage%'
    - '&b&l····· &aPlugin-Hooks &b&l·····'
    - '%pluginHooksList%'

  # Befehl /minebank permissions
  permissions:
    - '&b<-----------------&aBERECHTIGUNGEN MINEBANK&b----------------->'
    - '&eminebank.admin &7- Alle Berechtigungen'
    - '&eminebank.updatechecker &7- Erlaubt den Empfang einer Nachricht, wenn es ein Update gibt'
    - '&eminebank.bank.use &7- Erlaubt den Spielern, die Bank zu benutzen'
    - '&eminebank.bank.<BankName> &7- Setze die Bank <BankName> für den Spieler'

  command-no-argument: '%plugin% &7Verwende &e/minebank help &7um die Befehlsliste zu sehen.'

  no-perm: '%chatPlugin% &cDu hast keine Berechtigung, diesen Befehl zu benutzen.'

  console-error: '%plugin% &cDu kannst diesen Befehl nicht in der Konsole verwenden.'

config:

  # Wenn in der Konfiguration der Schlüssel "config.update-checker: true" aktiviert ist
  # Wird diese Nachricht nur im Chat für OP-Spieler oder
  # Spieler mit der Berechtigung "minebank.updatechecker" oder "minebank.admin" angezeigt
  update-checker:
    - '&b&l--> --> %plugin% &e&lUpdate-Checker &b&l<-- <--'
    - '&bEine neue Version ist verfügbar. &f(&e%latestVersion%&f).'
    - '&bLade sie hier herunter: &f%link%'
    - '&bEinige Updates erfordern möglicherweise, dass du bestimmte Dinge manuell änderst.'
    - '&bLies das Changelog: &f%link%/updates'

  # Wenn in der Konfiguration der Schlüssel "config.bank-allowed: false" aktiviert ist
  # Wird diese Nachricht im Chat angezeigt, wenn ein Bankbefehl verwendet wird
  bank-disabled: '%chatPlugin% &cDie Bank ist vorübergehend deaktiviert.'

bank:

  # Befehl /bank help
  help:
    - '&b<-----------------&aMINEBANK BEFEHLE&b----------------->'
    - '&e/bank &7- Öffne das GUI (1.13+)'
    - '&e/bank help &7- Zeige Bankhilfe'
    - '&e/bank data &7- Zeige deine Bankdaten wie Name, Level und Kontostand'
    - '&e/bank data [Spieler] &7- Zeige die Bankdaten des Spielers wie Name, Level und Kontostand'
    - '&e/bank add <Betrag> &7- Einzahlung des Betrags'
    - '&e/bank add half-balance &7- Einzahlung der Hälfte deines aktuellen Bankguthabens'
    - '&e/bank add all &7- Einzahlung deines gesamten Guthabens oder bis zum maximalen Bankguthaben'
    - '&e/bank add mid-max &7- Einzahlung der Hälfte deines maximalen Bankguthabens'
    - '&e/bank take <Betrag> &7- Abheben des Betrags'
    - '&e/bank take half-balance &7- Abhebung der Hälfte deines aktuellen Bankguthabens'
    - '&e/bank take all &7- Abhebung des gesamten Bankguthabens'
    - '&e/bank take mid-max &7- Abhebung der Hälfte deines maximalen Bankguthabens'
    - '&e/bank levelup &7- Steigere das Level deiner Bank'
    - '&e/bank top &7- Zeige die Spieler mit dem meisten Geld'
    - '&e/bank top [Betrag] &7- Zeige die [Betrag] Spieler mit dem meisten Geld'
    - '&e/bank receive profit &7- Empfange die offline akkumulierten Gewinne'

  general-usage: '%chatPlugin% &eVerwendung: /bank {help/data/add/take/levelup/top/receive/set}'
  data-usage: '%chatPlugin% &eVerwendung: /bank data [Spieler]'
  add-usage: '%chatPlugin% &eVerwendung: /bank {add/deposit} {<Betrag>/half-balance/all/mid-max}'
  take-usage: '%chatPlugin% &eVerwendung: /bank {take/withdraw} {<Betrag>/half-balance/all/mid-max}'
  levelup-usage: '%chatPlugin% &eVerwendung: /bank levelup'
  baltop-usage: '%chatPlugin% &eVerwendung: /bank {top/baltop/balancetop} [Betrag]'
  set-usage: '%chatPlugin% &eVerwendung: /bank set <Spieler> {balance/level} {<Betrag>/mid-max/max}'
  receive-usage: '%chatPlugin% &eVerwendung: /bank receive profit'

  data:
    player-bank-data:
      - '%chatPlugin% &e&lIhre Bankdaten:'
      - '&6&l>> &eName: &a%playerBankName%'
      - '&6&l>> &eLevel: &a%playerBankLevel%&e/&a%playerBankMaxLevel%'
      - '&6&l>> &eKontostand: &a%moneySymbol%%playerBankBalance%&e/&a%moneySymbol%%playerBankMaxBalance%'
    target-bank-data:
      - '%chatPlugin% &e&lBankdaten von %targetPlayerName%:'
      - '&6&l>> &eName: &a%targetBankName%'
      - '&6&l>> &eLevel: &a%targetBankLevel%&e/&a%targetBankMaxLevel%'
      - '&6&l>> &eKontostand: &a%moneySymbol%%targetBankBalance%&e/&a%moneySymbol%%targetBankMaxBalance%'

  add:
    deposit-success: '%chatPlugin% &aSie haben %moneySymbol%%amount% auf Ihr Bankkonto eingezahlt.'
    deposit-exceeds: '%chatPlugin% &cSie können nicht mehr als %moneySymbol%%playerBankMaxBalance% auf Ihrem aktuellen Banklevel einzahlen.'
    deposit-failure: '%chatPlugin% &cDer Betrag muss positiv und eine ganze Zahl sein.'
    not-enough-bank-balance: '%chatPlugin% &cSie haben nicht genug Guthaben, um diesen Betrag einzuzahlen.'
    target-deposit-success: '%chatPlugin% &aSie haben %moneySymbol%%amount% auf das Bankkonto von %targetPlayerName% eingezahlt.'
    target-deposit-exceeds: '%chatPlugin% &cDas Bankkonto von %targetPlayerName% kann nicht mehr als %moneySymbol%%targetBankMaxBalance% speichern.'
    target-deposit-failure: '%chatPlugin% &cDer Betrag muss positiv und eine ganze Zahl sein.'

  take:
    withdraw-success: '%chatPlugin% &aSie haben %moneySymbol%%amountReceived% von Ihrem Bankkonto abgehoben. Die Bankgebühr beträgt: %moneySymbol%%amountDeducted%. Der Bankzinssatz beträgt: %interestPercentage%%'
    withdraw-exceeds: '%chatPlugin% &cSie können diesen Betrag aufgrund der Zinsen nicht abheben.'
    withdraw-failure: '%chatPlugin% &cDer Betrag muss positiv und eine ganze Zahl sein.'
    not-enough-bank-balance: '%chatPlugin% &cSie haben nicht genug Guthaben auf Ihrem Konto, um diesen Betrag abzuheben.'
    target-withdraw-success: '%chatPlugin% &aSie haben %moneySymbol%%amount% vom Bankkonto von %targetPlayerName% abgehoben.'
    target-withdraw-failure: '%chatPlugin% &cDer Betrag muss positiv und eine ganze Zahl sein.'
    target-not-enough-bank-balance: '%chatPlugin% &cDas Bankkonto von %targetPlayerName% hat nicht genug Guthaben.'

  levelup:
    levelup-success: '%chatPlugin% &aSie haben erfolgreich auf Level %playerBankLevel% aufgestuft, jetzt können Sie insgesamt %moneySymbol%%playerBankMaxBalance% speichern.'
    already-max-level: '%chatPlugin% &cSie sind bereits auf dem maximalen Banklevel.'
    not-enough-bank-balance: '%chatPlugin% &cSie haben nicht genug Guthaben auf der Bank, um aufzuleveln, Sie benötigen %moneySymbol%%playerBankNextLevelCost%'

  top:
    title: '%chatPlugin% &eTop-Spieler mit dem meisten Guthaben auf der Bank:'
    entry: '&aTop %topBankPosition%: &f%topPlayerName% - %topBankName% - %topBankLevel% - %moneySymbol%%topBankBalance%'
    baltop-failure: '%chatPlugin% &cDer Betrag muss eine positive ganze Zahl sein.'

  receive:
    offline-received-success: '%chatPlugin% &aSie haben %moneySymbol%%offlineProfitAmount% an Offline-Vergütungen erhalten.'
    receive-exceeds: '%chatPlugin% &cSie können nicht mehr als %moneySymbol%%playerBankMaxBalance% mit Ihrem aktuellen Banklevel speichern.'
    offline-not-profit: '%chatPlugin% &cSie haben keine akkumulierten Offline-Vergütungen.'

  set:
    set-balance-success: '%chatPlugin% &aDas Bankguthaben von %targetPlayerName% wurde auf %moneySymbol%%amount% gesetzt.'
    max-balance: '%chatPlugin% &cDas Guthaben kann nicht höher sein als %moneySymbol%%targetBankMaxBalance%'
    set-level-success: '%chatPlugin% &aDas Banklevel von %targetPlayerName% wurde auf %amount% gesetzt.'
    max-level: '%chatPlugin% &cDas Level kann nicht höher sein als %targetBankMaxLevel%'
    set-amount-failure: '%chatPlugin% &cDer Betrag muss eine positive ganze Zahl sein.'
    target-player-not-found: '%chatPlugin% &cSpieler %targetPlayerName% wurde nicht gefunden.'

  profit:
    received: '%chatPlugin% &aSie haben %moneySymbol%%keepInBankProfit% erhalten, weil Sie Ihr Geld in der Bank aufbewahrt haben! Der Bankgewinn beträgt: %profitPercentage%%'
    min-storage: '%chatPlugin% &cSie müssen mindestens %moneySymbol%%minBankBalanceToReceiveProfit% auf der Bank haben, um mit der Gewinnbeteiligung zu beginnen.'
    max-storage: '%chatPlugin% &cSie müssen Geld von der Bank abheben, um weiterhin Gewinne zu erzielen.'
    offline-accumulated: '%chatPlugin% &aIhre Bank hat %moneySymbol%%offlineProfitAmount% an Guthaben angesammelt, während Sie offline waren. Um es abzuholen, verwenden Sie &e/bank receive profit.'

  gui:
    amount-withdraw: '%chatPlugin% &aGeben Sie den Betrag zum Abheben ein oder geben Sie "exit" ein, um abzubrechen:'
    amount-deposit: '%chatPlugin% &aGeben Sie den Betrag zum Einzahlen ein oder geben Sie "exit" ein, um abzubrechen:'
    amount-selected: '%chatPlugin% &aAusgewählter Betrag:'
    invalid-amount: '%chatPlugin% &cUngültiger Betrag. Versuchen Sie es erneut.'
    transaction-canceled: '%chatPlugin% &cTransaktion abgebrochen.'