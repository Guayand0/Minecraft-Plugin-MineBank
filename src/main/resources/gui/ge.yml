# Möglicherweise müssen Sie diese Seiten verwenden, um diese Datei zu ändern:
# Minecraft Material: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
# Inventory Slots: https://wiki.vg/images/b/bb/DoubleChest-slots.png
# Head Textures: https://minecraft-heads.com/custom-heads

gui:

  # Hauptinventar
  main:

    # Inventarname
    name: '&4&l[&6&lMine&a&lBank&4&l]'

    # Inventargröße
    size: 6 # 9*6=54 Erstellt ein Inventar mit 54 Slots (6 Reihen)

    # Inventarposition-Slot
    position-slot:

      # Alle leeren Inventar-Slots
      default:

        # Item, das im Inventar-Slot angezeigt wird
        # Minecraft Material: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
        item: WHITE_STAINED_GLASS_PANE

        # Menge auf 0 setzen, um die Anzeige des Items zu deaktivieren
        amount: 1

        # Einen benutzerdefinierten Namen für das Item festlegen oder '' verwenden, um den ursprünglichen Namen zu verwenden
        name: ' '

        # Kommentiere oder lösche das Lore, um das Lore nicht anzuzeigen
        lore:
        #  - 'Lore nicht sichtbar'

      # Item im Slot 10 des Inventars
      # Inventarslots: https://wiki.vg/images/b/bb/DoubleChest-slots.png
      10:
        item: EMERALD
        amount: 1
        name: '&aFüge %moneySymbol%500 hinzu'
        lore:
          - '&fKlicke, um %moneySymbol%500 &fins Bankkonto einzuzahlen'
        # Verwende den Befehl, wenn du auf das Item klickst
        command: 'bank add 500'
        # Erforderliche Berechtigung, um den Befehl zu verwenden
        permission: 'minebank.use'

      11:
        item: EMERALD
        amount: 3
        name: '&aHinzufügen der Hälfte des Maximalbetrags'
        lore:
          - '&fKlicke, um die Hälfte von'
          - '&emax &fspeicherbarem Guthaben einzuzahlen'
        command: 'bank add mid-max'

      12:
        item: EMERALD
        amount: 5
        name: '&aAlles hinzufügen'
        lore:
          - '&fKlicke, um alles'
          - '&fvom Speicher-Guthaben einzuzahlen'
        command: 'bank add all'

      19:
        item: EMERALD
        amount: 2
        name: '&aFüge %moneySymbol%2000 hinzu'
        lore:
          - '&fKlicke, um %moneySymbol%2000 &fins Bankkonto einzuzahlen'
        command: 'bank add 2000'

      20:
        item: EMERALD
        amount: 4
        name: '&aFüge die Hälfte des Guthabens hinzu'
        lore:
          - '&fKlicke, um die Hälfte des'
          - '&ftatsächlichen &fSpeicher-Guthabens einzuzahlen'
        command: 'bank add half-balance'

      21:
        item: EMERALD
        amount: 6
        name: '&aFüge benutzerdefinierten Betrag hinzu'
        lore:
          - '&fKlicke, um benutzerdefinierten Betrag'
          - '&fGeld auf dein Bankkonto einzuzahlen'
          - '&fGib &eexit &fzum Abbrechen der Transaktion ein'
        command: 'bank add <amount>'

      14:
        item: REDSTONE
        amount: 1
        name: '&c%moneySymbol%500 abheben'
        lore:
          - '&fKlicke, um %moneySymbol%500 &faus dem Bankkonto abzuheben'
        command: 'bank take 500'

      15:
        item: REDSTONE
        amount: 3
        name: '&cHälfte vom Maximum abheben'
        lore:
          - '&fKlicke, um die Hälfte von'
          - '&fdem maximalen Kontostand abzuheben'
        command: 'bank take mid-max'

      16:
        item: REDSTONE
        amount: 5
        name: '&cAlles abheben'
        lore:
          - '&fKlicke, um alles &fauszuzahlen'
          - '&fvom Bankkonto'
        command: 'bank take all'

      23:
        item: REDSTONE
        amount: 2
        name: '&c%moneySymbol%2000 abheben'
        lore:
          - '&fKlicke, um %moneySymbol%2000 &faus dem Bankkonto abzuheben'
        command: 'bank take 2000'

      24:
        item: REDSTONE
        amount: 4
        name: '&cHälfte vom Kontostand abheben'
        lore:
          - '&fKlicke, um die Hälfte des'
          - '&faktuellen Kontostands abzuheben'
        command: 'bank take half-balance'

      25:
        item: REDSTONE
        amount: 6
        name: '&cBetrag anpassen und abheben'
        lore:
          - '&fKlicke, um einen benutzerdefinierten Betrag'
          - '&fvom Bankkonto abzuheben'
          - '&fGib &eexit &fein, um die Transaktion abzubrechen'
        command: 'bank take <amount>'

      38:
        item: PLAYER_HEAD
        # Head Textures: https://minecraft-heads.com/custom-heads/head/50151-dollar
        # Verwende dies für Versionen zwischen 1.8 und 1.20.3 (öffne den Link und suche im Abschnitt "For Developers: Value")
        # texture: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYjg4OWNmY2JhY2JlNTk4ZThhMWNkODYxMGI0OWZjYjYyNjQ0ZThjYmE5ZDQ5MTFkMTIxMTM0NTA2ZDhlYTFiNyJ9fX0='
        # Verwende dies für Versionen zwischen 1.20.4 und höher (öffne den Link und suche im Abschnitt "For Developers: Minecraft URL")
        texture: 'http://textures.minecraft.net/texture/b889cfcbacbe598e8a1cd8610b49fcb62644e8cba9d4911d121134506d8ea1b7'
        amount: 1
        name: '&eDein Konto'
        lore:
          - '&aName: &f%playerBankName%'
          - '&aBalance: &f%moneySymbol%%playerBankBalance%/%moneySymbol%%playerBankMaxBalance%'
          - '&aLevel: &f%playerBankLevel%/%playerBankMaxLevel%'
          - ''
          - '&aWirtschaft: &f%moneySymbol%%playerEconomyBalance%'

      40:
        item: PLAYER_HEAD
        # Head Textures: https://minecraft-heads.com/custom-heads/head/70110-level-up
        # Verwende dies für Versionen zwischen 1.8 und 1.20.3 (öffne den Link und suche im Abschnitt "For Developers: Value")
        # texture: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNjQxNWEzNTQ2NmM3NTk5MDNhNDIzNjgyMjZmOGI0ODVhNDdiYjE2N2YwYTFlOTc4YjU1Mzg4ODEyNGE4OTA5ZCJ9fX0='
        # Verwende dies für Versionen zwischen 1.20.4 und höher (öffne den Link und suche im Abschnitt "For Developers: Minecraft URL")
        texture: 'http://textures.minecraft.net/texture/6415a35466c759903a42368226f8b485a47bb167f0a1e978b553888124a8909d'
        amount: 1
        name: '&eLevel Aufsteigen'
        lore:
          - '&aNächstes Level: &f%moneySymbol%%playerBankBalance%/%moneySymbol%%playerBankNextLevelCost%'
          - '&aBank Level: &f%playerBankLevel%/%playerBankMaxLevel%'
          - ''
          - '&fKlicke, um dein Banklevel zu &eleveln'
          - '&fwenn du genug Geld hast'
        command: 'bank levelup'

      42:
        item: PLAYER_HEAD
        # Head Textures: https://minecraft-heads.com/custom-heads/head/74737-gilded-blackstone-1
        # Verwende dies für Versionen zwischen 1.8 und 1.20.3 (öffne den Link und suche im Abschnitt "For Developers: Value")
        #texture: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvODZiYzE4NzcyYWNkMzQzZTZhYjIwMTAzYzRhOWU0MjExNWYyMjQ4NDI3ZWNiZDIwNjcxZDZjZDI0ZWU3ZWY4YyJ9fX0='
        # Verwende dies für Versionen zwischen 1.20.4 und höher (öffne den Link und suche im Abschnitt "For Developers: Minecraft URL")
        texture: 'http://textures.minecraft.net/texture/86bc18772acd343e6ab20103c4a9e42115f2248427ecbd20671d6cd24ee7ef8c'
        amount: 1
        name: '&eBank Top'
        lore:
          # Du kannst bis zu 100 Spieler hinzufügen
          - '&aTop %bankTopBankPosition_1%: &f%bankTopPlayerName_1% - %bankTopBankName_1% - %bankTopBankLevel_1% - %moneySymbol%%bankTopBankBalance_1%'
          - '&aTop %bankTopBankPosition_2%: &f%bankTopPlayerName_2% - %bankTopBankName_2% - %bankTopBankLevel_1% - %moneySymbol%%bankTopBankBalance_2%'
          - '&aTop %bankTopBankPosition_3%: &f%bankTopPlayerName_3% - %bankTopBankName_3% - %bankTopBankLevel_1% - %moneySymbol%%bankTopBankBalance_3%'
          - ''
          - '&6Deine Position:'
          - '&aTop %playerBankTop%: &b%playerName% - %playerBankName% - %playerBankLevel% - %moneySymbol%%playerBankBalance%'
          - ''
          - '&fKlicke, um die Top 10 Spieler zu sehen'
          - '&fmit dem höchsten Bankguthaben'
        command: 'bank baltop'