# You may need to use this pages to modify this file:
# Minecraft Material: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
# Inventory Slots: https://wiki.vg/images/b/bb/DoubleChest-slots.png
# Head Textures: https://minecraft-heads.com/custom-heads

gui:

  # Main inventory
  main:

    # Inventory title name
    name: '&4&l[&6&lMine&a&lBank&4&l]'

    # Inventory size
    size: 6 # 9*6=54 Create an inventario of 54 slots (6 rows)

    # Inventory position slot
    position-slot:

      # All empty inventory slots
      default:

        # Item displayed in inventory slot
        # Minecraft Material: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
        item: WHITE_STAINED_GLASS_PANE

        # Set amount 0 to disable show item
        amount: 1

        # Set a custom item name or type '' to use the original item name
        name: ' '

        # Comment or delete the lore to not show the lore
        lore:
        #  - 'Lore NOT visible'

      # Item in the slot 10 of the inventory
      # Inventory slots: https://wiki.vg/images/b/bb/DoubleChest-slots.png
      10:
        item: EMERALD
        amount: 1
        name: '&aAdd %moneySymbol%500'
        lore:
          - '&fClick to &edeposit %moneySymbol%500 &fin the bank'
        # Use the command when click item
        command: 'bank add 500'
        # Permission required to use the command
        permission: 'minebank.use'

      11:
        item: EMERALD
        amount: 3
        name: '&aAdd half of max'
        lore:
          - '&fClick to &edeposit half of'
          - '&emax &fstorage balance'
        command: 'bank add mid-max'

      12:
        item: EMERALD
        amount: 5
        name: '&aAdd all'
        lore:
          - '&fClick to &edeposit all &fof'
          - '&fstorage balance'
        command: 'bank add all'

      19:
        item: EMERALD
        amount: 2
        name: '&aAdd %moneySymbol%2000'
        lore:
          - '&fClick to &edeposit %moneySymbol%2000 &fin the bank'
        command: 'bank add 2000'

      20:
        item: EMERALD
        amount: 4
        name: '&aAdd half of balance'
        lore:
          - '&fClick to &edeposit half of'
          - '&ecurrent &fstorage balance'
        command: 'bank add half-balance'

      21:
        item: EMERALD
        amount: 6
        name: '&aAdd custom'
        lore:
          - '&fClick to &edeposit custom &famount'
          - '&fof money to your bank'
          - '&fType &eexit &fto cancel transaction'
        command: 'bank add <amount>'

      14:
        item: REDSTONE
        amount: 1
        name: '&cTake %moneySymbol%500'
        lore:
          - '&fClick to &ewithdraw %moneySymbol%500 &ffrom the bank'
        command: 'bank take 500'

      15:
        item: REDSTONE
        amount: 3
        name: '&cTake half of max'
        lore:
          - '&fClick to &ewithdraw half of'
          - '&emax &fstorage balance'
        command: 'bank take mid-max'

      16:
        item: REDSTONE
        amount: 5
        name: '&cTake all'
        lore:
          - '&fClick to &ewithdraw all &fof'
          - '&fstorage balance'
        command: 'bank take all'

      23:
        item: REDSTONE
        amount: 2
        name: '&cTake %moneySymbol%2000'
        lore:
          - '&fClick to &ewithdraw %moneySymbol%2000 &ffrom the bank'
        command: 'bank take 2000'

      24:
        item: REDSTONE
        amount: 4
        name: '&cTake half of balance'
        lore:
          - '&fClick to &ewithdraw half of'
          - '&ecurrent &fstorage balance'
        command: 'bank take half-balance'

      25:
        item: REDSTONE
        amount: 6
        name: '&cTake custom'
        lore:
          - '&fClick to &ewithdraw custom&f amount'
          - '&fof money to your bank'
          - '&fType &eexit &fto cancel transaction'
        command: 'bank take <amount>'

      38:
        item: PLAYER_HEAD
        # Head Texture: https://minecraft-heads.com/custom-heads/head/50151-dollar
        # Use this for versions between 1.8 and 1.20.3 inclusive (open the link and search in section "For Developers: Value")
        #texture: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYjg4OWNmY2JhY2JlNTk4ZThhMWNkODYxMGI0OWZjYjYyNjQ0ZThjYmE5ZDQ5MTFkMTIxMTM0NTA2ZDhlYTFiNyJ9fX0='
        # Use this for versions between 1.20.4 and upper inclusive (open the link and search in section "For Developers: Minecraft URL")
        texture: 'http://textures.minecraft.net/texture/b889cfcbacbe598e8a1cd8610b49fcb62644e8cba9d4911d121134506d8ea1b7'
        amount: 1
        name: '&eYour Account'
        lore:
          - '&aName: &f%playerBankName%'
          - '&aBalance: &f%moneySymbol%%playerBankBalance%/%moneySymbol%%playerBankMaxBalance%'
          - '&aLevel: &f%playerBankLevel%/%playerBankMaxLevel%'
          - ''
          - '&aEconomy: &f%moneySymbol%%playerEconomyBalance%'

      40:
        item: PLAYER_HEAD
        # Head Texture: https://minecraft-heads.com/custom-heads/head/70110-level-up
        # Use this for versions between 1.8 and 1.20.3 inclusive (open the link and search in section "For Developers: Value")
        #texture: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNjQxNWEzNTQ2NmM3NTk5MDNhNDIzNjgyMjZmOGI0ODVhNDdiYjE2N2YwYTFlOTc4YjU1Mzg4ODEyNGE4OTA5ZCJ9fX0='
        # Use this for versions between 1.20.4 and upper inclusive (open the link and search in section "For Developers: Minecraft URL")
        texture: 'http://textures.minecraft.net/texture/6415a35466c759903a42368226f8b485a47bb167f0a1e978b553888124a8909d'
        amount: 1
        name: '&eLevel Up'
        lore:
          - '&aNext level: &f%moneySymbol%%playerBankBalance%/%moneySymbol%%playerBankNextLevelCost%'
          - '&aBank level: &f%playerBankLevel%/%playerBankMaxLevel%'
          - ''
          - '&fClick to &elevel up &fyour bank'
          - '&fif you have enought money'
        command: 'bank levelup'

      42:
        item: PLAYER_HEAD
        # Head Texture: https://minecraft-heads.com/custom-heads/head/74737-gilded-blackstone-1
        # Use this for versions between 1.8 and 1.20.3 inclusive (open the link and search in section "For Developers: Value")
        #texture: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvODZiYzE4NzcyYWNkMzQzZTZhYjIwMTAzYzRhOWU0MjExNWYyMjQ4NDI3ZWNiZDIwNjcxZDZjZDI0ZWU3ZWY4YyJ9fX0='
        # Use this for versions between 1.20.4 and upper inclusive (open the link and search in section "For Developers: Minecraft URL")
        texture: 'http://textures.minecraft.net/texture/86bc18772acd343e6ab20103c4a9e42115f2248427ecbd20671d6cd24ee7ef8c'
        amount: 1
        name: '&eBank Top'
        lore:
          # You can add up to 100 players
          - '&aTop %bankTopBankPosition_1%: &f%bankTopPlayerName_1% - %bankTopBankName_1% - %bankTopBankLevel_1% - %moneySymbol%%bankTopBankBalance_1%'
          - '&aTop %bankTopBankPosition_2%: &f%bankTopPlayerName_2% - %bankTopBankName_2% - %bankTopBankLevel_1% - %moneySymbol%%bankTopBankBalance_2%'
          - '&aTop %bankTopBankPosition_3%: &f%bankTopPlayerName_3% - %bankTopBankName_3% - %bankTopBankLevel_1% - %moneySymbol%%bankTopBankBalance_3%'
          - ''
          - '&6Your position:'
          - '&aTop %playerBankTop%: &b%playerName% - %playerBankName% - %playerBankLevel% - %moneySymbol%%playerBankBalance%'
          - ''
          - '&fClick to see the &etop 10 players'
          - '&fwith the most bank balance'
        command: 'bank baltop'