# Você pode precisar usar estas páginas para modificar este arquivo:
# Minecraft Material: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
# Inventory Slots: https://wiki.vg/images/b/bb/DoubleChest-slots.png
# Head Textures: https://minecraft-heads.com/custom-heads

gui:

  # Inventário principal
  main:

    # Nome do título do inventário
    name: '&4&l[&6&lMine&a&lBank&4&l]'

    # Tamanho do inventário
    size: 6 # 9*6=54 Cria um inventário de 54 slots (6 linhas)

    # Slot de posição do inventário
    position-slot:

      # Todos os slots vazios do inventário
      default:

        # Item exibido no slot do inventário
        # Minecraft Material: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
        item: WHITE_STAINED_GLASS_PANE

        # Defina a quantidade como 0 para desabilitar a exibição do item
        amount: 1

        # Defina um nome personalizado para o item ou use '' para usar o nome original
        name: ' '

        # Comente ou exclua o lore para não exibir o lore
        lore:
        #  - 'Lore NÃO visível'

      # Item no slot 10 do inventário
      # Slots de inventário: https://wiki.vg/images/b/bb/DoubleChest-slots.png
      10:
        item: EMERALD
        amount: 1
        name: '&aAdicionar %moneySymbol%500'
        lore:
          - '&fClique para &edepositar %moneySymbol%500 &nof no banco'
        # Use o comando ao clicar no item
        command: 'bank add 500'
        # Permissão necessária para usar o comando
        permission: 'minebank.use'

      11:
        item: EMERALD
        amount: 3
        name: '&aAdicionar metade do máximo'
        lore:
          - '&fClique para &edepositar metade do'
          - '&emo saldo máximo de armazenamento'
        command: 'bank add mid-max'

      12:
        item: EMERALD
        amount: 5
        name: '&aAdicionar tudo'
        lore:
          - '&fClique para &edepositar tudo'
          - '&fdo saldo de armazenamento'
        command: 'bank add all'

      19:
        item: EMERALD
        amount: 2
        name: '&aAdicionar %moneySymbol%2000'
        lore:
          - '&fClique para &edepositar %moneySymbol%2000 &nof no banco'
        command: 'bank add 2000'

      20:
        item: EMERALD
        amount: 4
        name: '&aAdicionar metade do saldo'
        lore:
          - '&fClique para &edepositar metade do'
          - '&fsaldo atual de armazenamento'
        command: 'bank add half-balance'

      21:
        item: EMERALD
        amount: 6
        name: '&aAdicionar valor personalizado'
        lore:
          - '&fClique para &edepositar valor personalizado'
          - '&fde dinheiro no seu banco'
          - '&fDigite &eexit &fpara cancelar a transação'
        command: 'bank add <amount>'

      14:
        item: REDSTONE
        amount: 1
        name: '&cRetirar %moneySymbol%500'
        lore:
          - '&fClique para &esacar %moneySymbol%500 &ndo banco'
        command: 'bank take 500'

      15:
        item: REDSTONE
        amount: 3
        name: '&cRetirar metade do máximo'
        lore:
          - '&fClique para &esacar metade de'
          - '&fo saldo máximo de armazenamento'
        command: 'bank take mid-max'

      16:
        item: REDSTONE
        amount: 5
        name: '&cRetirar tudo'
        lore:
          - '&fClique para &esacar tudo &do saldo'
          - '&fde armazenamento'
        command: 'bank take all'

      23:
        item: REDSTONE
        amount: 2
        name: '&cRetirar %moneySymbol%2000'
        lore:
          - '&fClique para &esacar %moneySymbol%2000 &ndo banco'
        command: 'bank take 2000'

      24:
        item: REDSTONE
        amount: 4
        name: '&cRetirar metade do saldo'
        lore:
          - '&fClique para &esacar metade do'
          - '&fsaldo de armazenamento atual'
        command: 'bank take half-balance'

      25:
        item: REDSTONE
        amount: 6
        name: '&cRetirar valor personalizado'
        lore:
          - '&fClique para &esacar um valor personalizado'
          - '&fdo seu banco'
          - '&fDigite &eexit &fpara cancelar a transação'
        command: 'bank take <amount>'

      38:
        item: PLAYER_HEAD
        # Head Textures: https://minecraft-heads.com/custom-heads/head/50151-dollar
        # Use isto para versões entre 1.8 e 1.20.3 inclusive (abra o link e pesquise na seção "For Developers: Value")
        # texture: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYjg4OWNmY2JhY2JlNTk4ZThhMWNkODYxMGI0OWZjYjYyNjQ0ZThjYmE5ZDQ5MTFkMTIxMTM0NTA2ZDhlYTFiNyJ9fX0='
        # Use isto para versões entre 1.20.4 e superior (abra o link e pesquise na seção "For Developers: Minecraft URL")
        texture: 'http://textures.minecraft.net/texture/b889cfcbacbe598e8a1cd8610b49fcb62644e8cba9d4911d121134506d8ea1b7'
        amount: 1
        name: '&eSua Conta'
        lore:
          - '&aNome: &f%playerBankName%'
          - '&aSaldo: &f%moneySymbol%%playerBankBalance%/%moneySymbol%%playerBankMaxBalance%'
          - '&aNível: &f%playerBankLevel%/%playerBankMaxLevel%'
          - ''
          - '&aEconomia: &f%moneySymbol%%playerEconomyBalance%'

      40:
        item: PLAYER_HEAD
        # Head Textures: https://minecraft-heads.com/custom-heads/head/70110-level-up
        # Use isto para versões entre 1.8 e 1.20.3 inclusive (abra o link e pesquise na seção "For Developers: Value")
        # texture: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNjQxNWEzNTQ2NmM3NTk5MDNhNDIzNjgyMjZmOGI0ODVhNDdiYjE2N2YwYTFlOTc4YjU1Mzg4ODEyNGE4OTA5ZCJ9fX0='
        # Use isto para versões entre 1.20.4 e superior (abra o link e pesquise na seção "For Developers: Minecraft URL")
        texture: 'http://textures.minecraft.net/texture/6415a35466c759903a42368226f8b485a47bb167f0a1e978b553888124a8909d'
        amount: 1
        name: '&eSubir de Nível'
        lore:
          - '&aPróximo nível: &f%moneySymbol%%playerBankBalance%/%moneySymbol%%playerBankNextLevelCost%'
          - '&aNível do banco: &f%playerBankLevel%/%playerBankMaxLevel%'
          - ''
          - '&fClique para &e subir de nível &fsua conta bancária'
          - '&fse você tiver dinheiro suficiente'
        command: 'bank levelup'

      42:
        item: PLAYER_HEAD
        # Head Textures: https://minecraft-heads.com/custom-heads/head/74737-gilded-blackstone-1
        # Use isto para versões entre 1.8 e 1.20.3 inclusive (abra o link e pesquise na seção "For Developers: Value")
        #texture: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvODZiYzE4NzcyYWNkMzQzZTZhYjIwMTAzYzRhOWU0MjExNWYyMjQ4NDI3ZWNiZDIwNjcxZDZjZDI0ZWU3ZWY4YyJ9fX0='
        # Use isto para versões entre 1.20.4 e superior (abra o link e pesquise na seção "For Developers: Minecraft URL")
        texture: 'http://textures.minecraft.net/texture/86bc18772acd343e6ab20103c4a9e42115f2248427ecbd20671d6cd24ee7ef8c'
        amount: 1
        name: '&eBanco Top'
        lore:
          # Você pode adicionar até 100 jogadores
          - '&aTop %bankTopBankPosition_1%: &f%bankTopPlayerName_1% - %bankTopBankName_1% - %bankTopBankLevel_1% - %moneySymbol%%bankTopBankBalance_1%'
          - '&aTop %bankTopBankPosition_2%: &f%bankTopPlayerName_2% - %bankTopBankName_2% - %bankTopBankLevel_1% - %moneySymbol%%bankTopBankBalance_2%'
          - '&aTop %bankTopBankPosition_3%: &f%bankTopPlayerName_3% - %bankTopBankName_3% - %bankTopBankLevel_1% - %moneySymbol%%bankTopBankBalance_3%'
          - ''
          - '&6Sua posição:'
          - '&aTop %playerBankTop%: &b%playerName% - %playerBankName% - %playerBankLevel% - %moneySymbol%%playerBankBalance%'
          - ''
          - '&fClique para ver o &eTop 10 jogadores'
          - '&fcom o maior saldo bancário'
        command: 'bank baltop'
