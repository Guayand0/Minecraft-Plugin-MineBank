# Vous devrez peut-être utiliser ces pages pour modifier ce fichier:
# Matériel Minecraft: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
# Emplacements d'inventaire: https://wiki.vg/images/b/bb/DoubleChest-slots.png
# Textures de la tête: https://minecraft-heads.com/custom-heads

gui:

  # Inventaire principal
  main:

    # Nom de l'inventaire
    name: '&4&l[&6&lMine&a&lBank&4&l]'

    # Taille de l'inventaire
    size: 6 # 9*6=54 Crée un inventaire de 54 emplacements (6 rangées)

    # Emplacement de position d'inventaire
    position-slot:

      # Tous les emplacements d'inventaire vides
      default:

        # Article affiché dans l'emplacement d'inventaire
        # Matériel Minecraft: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
        item: WHITE_STAINED_GLASS_PANE

        # Définissez le montant 0 pour désactiver l'affichage de l'élément
        amount: 1

        # Définissez un nom d'élément personnalisé ou saisissez '' pour utiliser le nom d'élément d'origine
        name: ' '

        # Commentez ou supprimez l'lore pour ne pas afficher l'lore
        lore:
        # - 'L'lore n'est PAS visible'

      # Objet dans l'emplacement 10 de l'inventaire
      # Emplacements d'inventaire: https://wiki.vg/images/b/bb/DoubleChest-slots.png
      10:
        item: EMERALD
        amount: 1
        name: '&aAjouter 500'
        lore:
          - '&fCliquez pour &edéposer 500 &fdans la banque'
        # Commande lors du clic sur l'objet
        command: 'bank add 500'
        # Permission requise pour utiliser la commande
        permission: 'minebank.use'

      11:
        item: EMERALD
        amount: 3
        name: '&aAjouter la moitié du maximum'
        lore:
          - '&fCliquez pour &edéposer la moitié de'
          - '&ele solde maximum de stockage'
        command: 'bank add mid-max'

      12:
        item: EMERALD
        amount: 5
        name: '&aAjouter le maximum'
        lore:
          - '&fCliquez pour &edéposer le maximum &fde'
          - '&fle solde de stockage'
        command: 'bank add all'

      19:
        item: EMERALD
        amount: 2
        name: '&aAjouter 2000'
        lore:
          - '&fCliquez pour &edéposer 2000 &fdans la banque'
        command: 'bank add 2000'

      20:
        item: EMERALD
        amount: 4
        name: '&aAjouter la moitié du solde'
        lore:
          - '&fCliquez pour &edéposer la moitié de'
          - '&fle solde actuel de stockage'
        command: 'bank add half-balance'

      21:
        item: EMERALD
        amount: 6
        name: '&aAjouter un montant personnalisé'
        lore:
          - '&fCliquez pour &edéposer un montant personnalisé'
          - '&fdans votre banque'
          - '&fTapez &eexit &fpour annuler la transaction'
        command: 'bank add <amount>'

      14:
        item: REDSTONE
        amount: 1
        name: '&cRetirer 500'
        lore:
          - '&fCliquez pour &eretirer 500 &fde la banque'
        command: 'bank take 500'

      15:
        item: REDSTONE
        amount: 3
        name: '&cRetirer la moitié du maximum'
        lore:
          - '&fCliquez pour &eretirer la moitié de'
          - '&fle solde maximum de stockage'
        command: 'bank take mid-max'

      16:
        item: REDSTONE
        amount: 5
        name: '&cRetirer le maximum'
        lore:
          - '&fCliquez pour &eretirer le maximum &fde'
          - '&fle solde de stockage'
        command: 'bank take all'

      23:
        item: REDSTONE
        amount: 2
        name: '&cRetirer 2000'
        lore:
          - '&fCliquez pour &eretirer 2000 &fde la banque'
        command: 'bank take 2000'

      24:
        item: REDSTONE
        amount: 4
        name: '&cRetirer la moitié du solde'
        lore:
          - '&fCliquez pour &eretirer la moitié de'
          - '&fle solde actuel de stockage'
        command: 'bank take half-balance'

      25:
        item: REDSTONE
        amount: 6
        name: '&cRetirer un montant personnalisé'
        lore:
          - '&fCliquez pour &eretirer un montant personnalisé'
          - '&fde votre banque'
          - '&fTapez &eexit &fpour annuler la transaction'
        command: 'bank take <amount>'

      38:
        item: PLAYER_HEAD
        # Textures de la tête: https://minecraft-heads.com/custom-heads/head/50151-dollar
        # Utilisez ceci pour les versions entre 1.8 et 1.20.3 incluses (ouvrez le lien et recherchez dans la section "For Developers: Value")
        # texture: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYjg4OWNmY2JhY2JlNTk4ZThhMWNkODYxMGI0OWZjYjYyNjQ0ZThjYmE5ZDQ5MTFkMTIxMTM0NTA2ZDhlYTFiNyJ9fX0='
        # Utilisez ceci pour les versions entre 1.20.4 et supérieures incluses (ouvrez le lien et recherchez dans la section "For Developers: Minecraft URL")
        texture: 'http://textures.minecraft.net/texture/b889cfcbacbe598e8a1cd8610b49fcb62644e8cba9d4911d121134506d8ea1b7'
        amount: 1
        name: '&eVotre Compte'
        lore:
          - '&aBanque: &f%playerBankName%'
          - '&aSolde: &f%moneySymbol%%playerBankBalance%/%moneySymbol%%playerBankMaxBalance%'
          - '&aNiveau: &f%playerBankLevel%/%playerBankMaxLevel%'
          - ''
          - '&aÉconomie: &f%moneySymbol%%playerEconomyBalance%'

      40:
        item: PLAYER_HEAD
        # Textures de la tête: https://minecraft-heads.com/custom-heads/head/70110-level-up
        # Utilisez ceci pour les versions entre 1.8 et 1.20.3 incluses (ouvrez le lien et recherchez dans la section "For Developers: Value")
        # texture: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNjQxNWEzNTQ2NmM3NTk5MDNhNDIzNjgyMjZmOGI0ODVhNDdiYjE2N2YwYTFlOTc4YjU1Mzg4ODEyNGE4OTA5ZCJ9fX0='
        # Utilisez ceci pour les versions entre 1.20.4 et supérieures incluses (ouvrez le lien et recherchez dans la section "For Developers: Minecraft URL")
        texture: 'http://textures.minecraft.net/texture/6415a35466c759903a42368226f8b485a47bb167f0a1e978b553888124a8909d'
        amount: 1
        name: '&eMonter de Niveau'
        lore:
          - '&aProchain niveau: &f%moneySymbol%%playerBankBalance%/%moneySymbol%%playerBankNextLevelCost%'
          - '&aNiveau de la banque: &f%playerBankLevel%/%playerBankMaxLevel%'
          - ''
          - '&fCliquez pour &emonter de niveau &evotre banque'
          - '&fsi vous avez assez d`argent'
        command: 'bank levelup'

      42:
        item: PLAYER_HEAD
        # Textures de la tête: https://minecraft-heads.com/custom-heads/head/74737-gilded-blackstone-1
        # Utilisez ceci pour les versions entre 1.8 et 1.20.3 incluses (ouvrez le lien et recherchez dans la section "For Developers: Value")
        # texture: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvODZiYzE4NzcyYWNkMzQzZTZhYjIwMTAzYzRhOWU0MjExNWYyMjQ4NDI3ZWNiZDIwNjcxZDZjZDI0ZWU3ZWY4YyJ9fX0='
        # Utilisez ceci pour les versions entre 1.20.4 et supérieures incluses (ouvrez le lien et recherchez dans la section "For Developers: Minecraft URL")
        texture: 'http://textures.minecraft.net/texture/86bc18772acd343e6ab20103c4a9e42115f2248427ecbd20671d6cd24ee7ef8c'
        amount: 1
        name: '&eTop de la Banque'
        lore:
          # Vous pouvez ajouter jusqu'à 100 joueurs
          - '&aTop %bankTopBankPosition_1%: &f%bankTopPlayerName_1% - %bankTopBankName_1% - %bankTopBankLevel_1% - %moneySymbol%%bankTopBankBalance_1%'
          - '&aTop %bankTopBankPosition_2%: &f%bankTopPlayerName_2% - %bankTopBankName_2% - %bankTopBankLevel_1% - %moneySymbol%%bankTopBankBalance_2%'
          - '&aTop %bankTopBankPosition_3%: &f%bankTopPlayerName_3% - %bankTopBankName_3% - %bankTopBankLevel_1% - %moneySymbol%%bankTopBankBalance_3%'
          - ''
          - '&6Votre position:'
          - '&aTop %playerBankTop%: &b%playerName% - %playerBankName% - %playerBankLevel% - %moneySymbol%%playerBankBalance%'
          - ''
          - '&fCliquez pour voir les &etop 10 joueurs'
          - '&favec le plus de solde bancaire'
        command: 'bank baltop'