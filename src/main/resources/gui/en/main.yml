gui:
  main:

    # Inventory title name
    name: '&4&l[&6&lMine&a&lBank&4&l]'

    # Inventory size
    size: 6 # 9*6=54 Create an inventory of 54 slots (6 rows)

    # Inventory position slot
    position-slot:

      # All empty inventory slots or listed slots
      default:

        # A list of slots to use the default item
        list: 1,2,3,4,5,6,7,8,0, 45,46,47,48,49,50,51,52,53

        # Item displayed in inventory slot
        # Minecraft Material: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
        item: WHITE_STAINED_GLASS_PANE

        # Set amount 0 to disable show item
        amount: 1

        # Set a custom item name or type '' to use the original item name
        name: ' '

        # Comment or delete the lore to not show the lore
        lore:
        #  - 'Lore NOT visible'

      # Item in the slot 10 of the inventory
      # Inventory slots: https://wiki.vg/images/b/bb/DoubleChest-slots.png
      10:
        item: EMERALD
        amount: 1
        name: '&aAdd %moneySymbol%500'
        lore:
          - '&fClick to &edeposit %moneySymbol%500 &fin the bank'
        # Use the command when click item
        command:
          - '<player> bank add 500'
        # Permission required to use the command
        permission:
          - 'minebank.use'

      11:
        item: EMERALD
        amount: 3
        name: '&aAdd half of max'
        lore:
          - '&fClick to &edeposit half of'
          - '&emax &fstorage balance'
        command:
          - '<player> bank add mid-max'

      12:
        item: EMERALD
        amount: 5
        name: '&aAdd all'
        lore:
          - '&fClick to &edeposit all &fof'
          - '&fstorage balance'
        command:
          - '<player> bank add all'

      19:
