        amount: 6
        name: '&aAdd custom'
        lore:
          - '&fClick to &edeposit custom &famount'
          - '&fof money to your bank'
          - '&fType &eexit &fto cancel transaction'
        command:
          - '<player> bank add <amount>'

      14:
