# Możesz potrzebować tych stron do modyfikacji tego pliku:
# Materiały Minecraft: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
# Sloty ekwipunku: https://wiki.vg/images/b/bb/DoubleChest-slots.png
# Tekstury głów: https://minecraft-heads.com/custom-heads

gui:

  # Główny inwentarz
  main:

    # Nazwa tytułu inwentarza
    name: '&4&l[&6&lMine&a&lBank&4&l]'

    # Rozmiar inwentarza
    size: 6 # 9*6=54 Utwórz inwentarz 54 slotów (6 rzędów)

    # Miejsce na pozycję w inwentarza
    position-slot:

      # Wszystkie puste sloty inwentarza
      default:

        # Przedmiot wyświetlany w slocie inwentarza
        # Materiały Minecraft: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
        item: WHITE_STAINED_GLASS_PANE

        # Ustaw kwotę 0, aby wyłączyć wyświetlanie elementu
        amount: 1

        # Ustaw niestandardową nazwę elementu lub wpisz '', aby użyć oryginalnej nazwy elementu
        name: ' '

        # Usuń lub skomentuj lore, aby nie było widoczne
        lore:
        #  - 'lore niewidoczne'

      # Przedmiot w slocie 10 ekwipunku
      # Sloty ekwipunku: https://wiki.vg/images/b/bb/DoubleChest-slots.png
      10:
        item: EMERALD
        amount: 1
        name: '&aDodaj %moneySymbol%500'
        lore:
          - '&fKliknij, aby &ewpłacić %moneySymbol%500 &fdo banku'
        # Wykonaj polecenie po kliknięciu przedmiotu
        command: 'bank add 500'
        # Wymagane uprawnienie do użycia polecenia
        permission: 'minebank.use'

      11:
        item: EMERALD
        amount: 3
        name: '&aDodaj połowę maksymalnej wartości'
        lore:
          - '&fKliknij, aby &ewpłacić połowę'
          - '&emaks &fbilansu magazynu'
        command: 'bank add mid-max'

      12:
        item: EMERALD
        amount: 5
        name: '&aDodaj wszystko'
        lore:
          - '&fKliknij, aby &ewpłacić całość &fbilansu'
          - '&fmagazynu'
        command: 'bank add all'

      19:
        item: EMERALD
        amount: 2
        name: '&aDodaj %moneySymbol%2000'
        lore:
          - '&fKliknij, aby &ewpłacić %moneySymbol%2000 &fdo banku'
        command: 'bank add 2000'

      20:
        item: EMERALD
        amount: 4
        name: '&aDodaj połowę salda'
        lore:
          - '&fKliknij, aby &ewpłacić połowę'
          - '&eaktualnego &fbilansu magazynu'
        command: 'bank add half-balance'

      21:
        item: EMERALD
        amount: 6
        name: '&aDodaj niestandardową kwotę'
        lore:
          - '&fKliknij, aby &ewpłacić niestandardową &fkwotę'
          - '&fpieniędzy do swojego banku'
          - '&fWpisz &eexit &faby anulować transakcję'
        command: 'bank add <amount>'

      14:
        item: REDSTONE
        amount: 1
        name: '&cWypłać %moneySymbol%500'
        lore:
          - '&fKliknij, aby &ewypłacić %moneySymbol%500 &fz banku'
        command: 'bank take 500'

      15:
        item: REDSTONE
        amount: 3
        name: '&cWypłać połowę maksymalnej wartości'
        lore:
          - '&fKliknij, aby &ewypłacić połowę'
          - '&emaks &fbilansu magazynu'
        command: 'bank take mid-max'

      16:
        item: REDSTONE
        amount: 5
        name: '&cWypłać wszystko'
        lore:
          - '&fKliknij, aby &ewypłacić całość &fbilansu'
          - '&fmagazynu'
        command: 'bank take all'

      23:
        item: REDSTONE
        amount: 2
        name: '&cWypłać %moneySymbol%2000'
        lore:
          - '&fKliknij, aby &ewypłacić %moneySymbol%2000 &fz banku'
        command: 'bank take 2000'

      24:
        item: REDSTONE
        amount: 4
        name: '&cWypłać połowę salda'
        lore:
          - '&fKliknij, aby &ewypłacić połowę'
          - '&eaktualnego &fbilansu magazynu'
        command: 'bank take half-balance'

      25:
        item: REDSTONE
        amount: 6
        name: '&cWypłać niestandardową kwotę'
        lore:
          - '&fKliknij, aby &ewypłacić niestandardową&f kwotę'
          - '&fpieniędzy z banku'
          - '&fWpisz &eexit &faby anulować transakcję'
        command: 'bank take <amount>'

      38:
        item: PLAYER_HEAD
        # Tekstura głowy: https://minecraft-heads.com/custom-heads/head/50151-dollar
        # Użyj tej wartości dla wersji od 1.8 do 1.20.3 (otwórz link i znajdź sekcję "For Developers: Value")
        #texture: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYjg4OWNmY2JhY2JlNTk4ZThhMWNkODYxMGI0OWZjYjYyNjQ0ZThjYmE5ZDQ5MTFkMTIxMTM0NTA2ZDhlYTFiNyJ9fX0='
        # Użyj tego adresu dla wersji 1.20.4 i nowszych (otwórz link i znajdź sekcję "For Developers: Minecraft URL")
        texture: 'http://textures.minecraft.net/texture/b889cfcbacbe598e8a1cd8610b49fcb62644e8cba9d4911d121134506d8ea1b7'
        amount: 1
        name: '&eTwoje konto'
        lore:
          - '&aNazwa: &f%playerBankName%'
          - '&aSaldo: &f%moneySymbol%%playerBankBalance%/%moneySymbol%%playerBankMaxBalance%'
          - '&aPoziom: &f%playerBankLevel%/%playerBankMaxLevel%'
          - ''
          - '&aEkonomia: &f%moneySymbol%%playerEconomyBalance%'

      40:
        item: PLAYER_HEAD
        # Tekstura głowy: https://minecraft-heads.com/custom-heads/head/70110-level-up
        # Użyj tej wartości dla wersji od 1.8 do 1.20.3 (otwórz link i znajdź sekcję "For Developers: Value")
        #texture: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNjQxNWEzNTQ2NmM3NTk5MDNhNDIzNjgyMjZmOGI0ODVhNDdiYjE2N2YwYTFlOTc4YjU1Mzg4ODEyNGE4OTA5ZCJ9fX0='
        # Użyj tego adresu dla wersji 1.20.4 i nowszych (otwórz link i znajdź sekcję "For Developers: Minecraft URL")
        texture: 'http://textures.minecraft.net/texture/6415a35466c759903a42368226f8b485a47bb167f0a1e978b553888124a8909d'
        amount: 1
        name: '&ePoziom w górę'
        lore:
          - '&aNastępny poziom: &f%moneySymbol%%playerBankBalance%/%moneySymbol%%playerBankNextLevelCost%'
          - '&aPoziom banku: &f%playerBankLevel%/%playerBankMaxLevel%'
          - ''
          - '&fKliknij, aby &epodnieść poziom &fswojego banku'
          - '&fjeśli masz wystarczająco pieniędzy'
        command: 'bank levelup'

      42:
        item: PLAYER_HEAD
        # Tekstura głowy: https://minecraft-heads.com/custom-heads/head/74737-gilded-blackstone-1
        # Użyj tej wartości dla wersji od 1.8 do 1.20.3 (otwórz link i znajdź sekcję "For Developers: Value")
        #texture: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvODZiYzE4NzcyYWNkMzQzZTZhYjIwMTAzYzRhOWU0MjExNWYyMjQ4NDI3ZWNiZDIwNjcxZDZjZDI0ZWU3ZWY4YyJ9fX0='
        # Użyj tego adresu dla wersji 1.20.4 i nowszych (otwórz link i znajdź sekcję "For Developers: Minecraft URL")
        texture: 'http://textures.minecraft.net/texture/86bc18772acd343e6ab20103c4a9e42115f2248427ecbd20671d6cd24ee7ef8c'
        amount: 1
        name: '&eRanking banków'
        lore:
          # Możesz dodać do 100 graczy
          - '&aTop %bankTopBankPosition_1%: &f%bankTopPlayerName_1% - %bankTopBankName_1% - %bankTopBankLevel_1% - %moneySymbol%%bankTopBankBalance_1%'
          - '&aTop %bankTopBankPosition_2%: &f%bankTopPlayerName_2% - %bankTopBankName_2% - %bankTopBankLevel_1% - %moneySymbol%%bankTopBankBalance_2%'
          - '&aTop %bankTopBankPosition_3%: &f%bankTopPlayerName_3% - %bankTopBankName_3% - %bankTopBankLevel_1% - %moneySymbol%%bankTopBankBalance_3%'
          - ''
          - '&6Twoja pozycja:'
          - '&aTop %playerBankTop%: &b%playerName% - %playerBankName% - %playerBankLevel% - %moneySymbol%%playerBankBalance%'
          - ''
          - '&fKliknij, aby zobaczyć &etop 10 graczy'
          - '&fz największym saldem bankowym'
        command: 'bank baltop'