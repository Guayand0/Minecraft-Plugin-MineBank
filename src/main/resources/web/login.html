<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MineBank Web</title>
  <style>
    :root{--bg:#0b1410;--card:#111b14;--card-2:#0f1a13;--text:#e7f5ee;--muted:#9fb4a9;--green:#22c55e;--green-2:#16a34a;--gold:#fbbf24;--gold-2:#f59e0b;--danger:#ef4444;}
    *{box-sizing:border-box;font-family:Segoe UI, Arial, sans-serif;}
    body{margin:0;background:radial-gradient(1200px 600px at 10% 10%,rgba(34,197,94,.18),transparent),radial-gradient(900px 500px at 90% 20%,rgba(245,158,11,.14),transparent),linear-gradient(135deg,#0b1410,#0f1a13);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .card{background:linear-gradient(180deg,rgba(17,27,20,.95),rgba(15,26,19,.95));padding:32px;border-radius:18px;max-width:620px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.45);border:1px solid rgba(34,197,94,.18)}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .logo{display:flex;gap:12px;align-items:center;margin-bottom:12px}
    .logo img{width:96px;height:96px;object-fit:contain;border-radius:18px;border:none;background:none;padding:8px}
    h1{margin:0;font-size:26px;letter-spacing:.2px}
    p{color:var(--muted);line-height:1.6}
    code{background:#0b1220;padding:2px 6px;border-radius:6px;border:1px solid rgba(34,197,94,.2)}
    .lang{background:#0b1220;color:var(--text);border:1px solid #1f2937;border-radius:10px;padding:6px 10px}
  </style>
</head>
<body>
  <div class="card">
    <div class="topbar">
      <div class="logo">
        <img src="/web/bank.png" alt="MineBank" />
        <h1 data-i18n="index.title">MineBank Web Panel</h1>
      </div>
      <select id="langSelect" class="lang" aria-label="Language">
        <option value="en">EN</option>
        <option value="es">ES</option>
      </select>
    </div>
    <p data-i18n="index.token">This panel is protected by a token. Use <code>/bank web</code> in-game to receive your private link.</p>
  </div>
  <script>
    const translations = {
      en: {
        'index.title': 'MineBank Web Panel',
        'index.token': 'This panel is protected by a token. Use <code>/bank web</code> in-game to receive your private link.'
      },
      es: {
        'index.title': 'Panel Web de MineBank',
        'index.token': 'Este panel esta protegido por un token. Usa <code>/bank web</code> en el juego para recibir tu enlace privado.'
      }
    };
    const select = document.getElementById('langSelect');
    const saved = localStorage.getItem('mb_lang') || 'en';
    select.value = saved;
    function applyLang(lang){
      const dict = translations[lang] || translations.en;
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) {
          el.innerHTML = dict[key];
        }
      });
    }
    select.addEventListener('change', () => {
      localStorage.setItem('mb_lang', select.value);
      applyLang(select.value);
    });
    applyLang(saved);
  </script>
</body>
</html>
