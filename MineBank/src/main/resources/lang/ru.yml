messages:

  help:
    - '&b<-----------------&aКоманды MINEBANK&a----------------->'
    - '&e/minebank help &7- Показать это сообщение'
    - '&e/minebank reload &7- Перезагрузить настройки плагина'
    - '&e/minebank version &7- Показать версию плагина'
    - '&e/minebank author &7- Показать автора плагина'
    - '&e/minebank permissions &7- Показать список разрешений плагина'
    - '&e/minebank plugin &7- Показать ссылку для загрузки плагина'
    - '&e/bank help &7- Показать список команд банка'
    - '&7Альтернативные команды: &eminebank&7, &emb'

  help-bank:
    - '&b<-----------------&aКоманды MINEBANK&a----------------->'
    - '&e/bank &7- Открыть меню банка (1.13+)'
    - '&e/bank help &7- Показать это сообщение'
    - '&e/bank add <сумма> &7- Внести определённую сумму на счёт'
    - '&e/bank add mid &7- Внести половину от своего баланса на счёт'
    - '&e/bank add midmax &7- Внести половину от максимального балансного счёта'
    - '&e/bank add max &7- Внести сумму для максимального балансного счёта'
    - '&e/bank take <сумма> &7- Снять определённую сумму со счёта'
    - '&e/bank take mid &7- Снять половину от своего баланса со счёта'
    - '&e/bank take midmax &7- Снять половину от максимального балансного счёта'
    - '&e/bank take max &7- Снять всю сумму с балансного счёта'
    - '&e/bank set <игрок> bal <сумма> &7- Установить сумму балансного счёта игрока'
    - '&e/bank set <игрок> bal midmax &7- Установить игроку сумму в виде половины от максимального баланса его счёта'
    - '&e/bank set <игрок> bal max &7- Установить игроку сумму в виде максимального баланса его счёта'
    - '&e/bank set <игрок> level <уровень> &7- Установить уровень банка игроку'
    - '&e/bank set <игрок> level midmax &7- Установить игроку уровень в виде половин от максимального уровня банка'
    - '&e/bank set <игрок> level max &7- Установить игроку максимальный уровень банка'
    - '&e/bank set <игрок> level <уровень> true &7- Установить игроку уровень и сразу максимальный баланс его счёта'
    - '&e/bank set <игрок> level <уровень> false &7- Установить игроку уровень и изменить баланс его счёта, если он больше максимума'
    - '&e/bank top &7- Показать топ-10 игроков по убыванию баланса'
    - '&e/bank bal &7- Проверить свой баланс'
    - '&e/bank bal <игрок> &7- Проверить баланс другого игрока'
    - '&e/bank max bal &7- Проверить максимальную сумму вашего счёта'
    - '&e/bank max level &7- Проверить максимальный уровень'
    - '&e/bank level &7- Проверить уровень вашего банка'
    - '&e/bank level <игрок> &7- Проверить уровень банка игрока'
    - '&e/bank levelup &7- Повысить уровень своего банка'

  reload: '%plugin% &aПлагин успешно перезагружен.'
  version: '%plugin% &aВерсия плагина: &b%version%'
  author: '%plugin% &aАвтор плагина: &b%author%'

  permissions:
    - '&b<-----------------&aРазрешения MINEBANK&a----------------->'
    - '&eminebank.admin &7- Полный доступ'
    - '&eminebank.updatechecker &7- Получать уведомления о доступных обновлениях'
    - '&eminebank.use &7- Доступ к использованию банка'
    - '&eminebank.bank.<bankName> &7- Установить банк <bankName> для игрока'

  command-no-argument: '%plugin% &7Чтобы просмотреть список команд, используйте &e/minebank help &7.'
  no-perm: '%plugin% &cУ вас нет разрешения на использование этой команды.'
  console-error: '%plugin% &cЭту команду нельзя использовать из консоли.'


config:

  bank-disabled: '%plugin% &cФункционал банка в данный момент отключена.'
  update-checker: '%plugin% &bДоступна новая версия &e(&f%latestversion%&e)&b. Ссылка для загрузки: &7%link%'

