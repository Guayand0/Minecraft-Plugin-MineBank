bank:

  usage:
    bank: '%plugin% &eПравильное использование: /bank {help/add/take/bal/top/max/level/levelup/set}'
    add: '%plugin% &eПравильное использование: /bank add {<сумма>/mid/midmax/max}'
    take: '%plugin% &eПравильное использование: /bank take {<сумма>/mid/midmax/max}'
    set: '%plugin% &eПравильное использование: /bank set <игрок> {bal/level} {<сумма>/midmax/max} [true/false]'
    bal: '%plugin% &eПравильное использование: /bank bal [игрок]'
    max: '%plugin% &eПравильное использование: /bank max {bal/level} [игрок]'
    level: '%plugin% &eПравильное использование: /bank level [игрок]'

  bal:
    playerBankBalance: '%plugin% &eВаш текущий баланс в банке: &a%moneySymbol%%playerBankBalance%'
    targetBankBalance: '%plugin% &eБаланс банка игрока %targetName%: &a%moneySymbol%%targetBankBalance%'

  take:
    withdrawSuccess: '%plugin% &aВы сняли %moneySymbol%%amountReceived% со своего счёта. Комиссия банку: %moneySymbol%%amountDeducted%. Процент банку: %interestPercentage%%'
    withdrawFailure: '%plugin% &cСумма должна быть положительным целым числом.'
    withdrawExceeds: '%plugin% &cУ вас недостаточно средств на счету, чтобы снять.'

  add:
    depositSuccess: '%plugin% &aВы внесли %moneySymbol%%amount% на свой счёт.'
    balanceExceeds: '%plugin% &cВы не можете хранить более %moneySymbol%%playerBankMaxStorage% на своём текущем уровне банка.'
    depositFailure: '%plugin% &cСумма должна быть положительным целым числом.'
    notEnoughMoney: '%plugin% &cУ вас недостаточно средств для внесения на счёт.'

  set:
    maxBalance: '%plugin% &cСумма не может быть больше %moneySymbol%%targetBankMaxStorage%'
    maxLevel: '%plugin% &cУровень не может быть выше %targetBankMaxLevel%'
    setBalanceSuccess: '%plugin% &aУстановлен баланс счёта игрока %targetName% на %moneySymbol%%amount%'
    setLevelSuccess: '%plugin% &aУстановлен уровень банка игрока %targetName% на %setBankLevel%'
    depositFailure: '%plugin% &cСумма должна быть положительным целым числом.'

  top:
    title: '%plugin% &eТоп игроков с наибольшим количеством средств на счету в банке:'
    entry: '&aТоп %topPosition%: &f%topName% - %topBank% - %moneySymbol%%topBalance%'

  level:
    playerBankLevel: '%plugin% &eВаш уровень банка: &a%playerBankLevel%'
    targetBankLevel: '%plugin% &eУровень банка %targetName%: &a%targetBankLevel%'

  levelup:
    notEnoughMoney: '%plugin% &cУ вас недостаточно средств на счёте, чтобы повысить уровень банка, вам нужно %moneySymbol%%unlockNextLevelPrice%'
    unlockPriceError: '%plugin% &cНедоступная цена разблокировки в конфигурации для уровня %unlockNextLevel%'
    success: '%plugin% &aВы успешно повысили уровень банка до %playerBankLevel%'
    alreadyMax: '%plugin% &cВы уже на максимальном уровне банка.'

  max:
    playerBankMaxStorage: '%plugin% &eМаксимальная сумма, которую вы можете хранить на своём уровне банка: &a%moneySymbol%%playerBankMaxStorage%'
    targetBankMaxStorage: '%plugin% &eМаксимальная сумма, которую игрок %targetName% может хранить на своём уровне банка: &a%moneySymbol%%targetBankMaxStorage%'
    playerBankMaxLevel: '%plugin% &aВаш уровень банка &e%playerBankMaxLevel%.'
    targetBankMaxLevel: '%plugin% &aУровень банка у игрока %targetName% &e%targetBankMaxLevel%.'

  profit:
    received: '%plugin% &aВы получили %moneySymbol%%keepInBankProfit% за хранение средств на счету в банке! Процент прибыли: %profitPercentage%%'
    min-storage: '%plugin% &cВам нужно иметь как минимум %moneySymbol%%minAmountToWinProfit% на счёте, чтобы начать получать процент.'
    max-storage: '%plugin% &cВам нужно снять деньги со счёта, чтобы продолжить получать процент.'

  notPlayer: '%plugin% &cТолько игроки могут использовать эту команду.'
  notFoundPlayer: '%plugin% &cИгрок %targetName% не найден.'

